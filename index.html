":"三 (tam) / 心 (tâm)","en":"three (Sino); toothpick; heart, mind (tâm lý)","zh":"三；牙籤；心","kind":"d"},"s0022":{"vi":"lan, lăn, lân","note":"in Saigon the final -n here sounds like -ng: lang, lăng, lâng","hz":"蘭 (lan) / 鄰 (lân)","en":"orchid, spread; roll; neighbouring (lân cận)","zh":"蘭花、擴散；滾；鄰近","kind":"d"},"s0023":{"vi":"to, tô, tơ","note":"o: open, like German \"offen\"; ô: closed, like \"Ofen\"; ơ: unrounded, like the vowel in English \"bird\", long; â is its short partner","hz":"","en":"big; bowl (Saigon; Hanoi: bát); silk","zh":"大；碗（南部用 tô）；絲","kind":"d"},"s0024":{"vi":"lo, lô, lơ","note":"","hz":"","en":"worry; lot, plot (lô đất); ignore (lơ đi)","zh":"擔心；地段；不理（lơ đi）","kind":"d"},"s0025":{"vi":"mua, mưa","note":"ư: say u but spread the lips as for i","hz":"","en":"buy; rain","zh":"買；下雨","kind":"d"},"s0026":{"vi":"thu, thư","note":"","hz":"秋 (thu) / 書 (thư)","en":"autumn; letter","zh":"秋天；信","kind":"d"},"s0027":{"vi":"tu, tư","note":"","hz":"修 (tu) / 私 (tư)","en":"practise (religion); private, personal (tư nhân); also four, fourth (thứ Tư, chú Tư)","zh":"修行；私（tư nhân 私人）；四（thứ Tư 星期三）","kind":"d"},"s0028":{"vi":"me, mê","note":"e: open, like German \"Bett\"; ê: closed, like \"Beet\"","hz":"迷 (mê)","en":"tamarind; crazy about","zh":"羅望子；迷、著迷","kind":"d"},"s0029":{"vi":"chè, chê","note":"","hz":"","en":"sweet soup; criticise, look down on","zh":"甜湯；嫌、批評","kind":"d"},"s0030":{"vi":"bé, bế","note":"","hz":"","en":"small, little kid; carry (a child) in the arms","zh":"小、小孩；抱（小孩）","kind":"d"},"s0031":{"vi":"bia, biết","note":"ia: i gliding into a lazy ơ; written iê before a final consonant, same sound","hz":"","en":"beer; know","zh":"啤酒；知道","kind":"d"},"s0032":{"vi":"mua, muốn","note":"ua: u gliding into ơ; written uô before a final","hz":"","en":"buy; want","zh":"買；想要","kind":"d"},"s0033":{"vi":"mưa, mượn","note":"ưa: ư gliding into ơ; written ươ before a final","hz":"","en":"rain; borrow","zh":"下雨；借","kind":"d"},"s0034":{"vi":"chưa, được","note":"","hz":"","en":"not yet; can, get, okay","zh":"還沒；可以、得到","kind":"d"},"s0035":{"vi":"Trời mát quá.","note":"quá with the k kept, not wá. wá is the fast colloquial form you will hear, kwá is what you say 唸 quá，不要唸成 wá","hz":"","en":"The weather is so nice and cool.","zh":"天氣好涼快。","kind":"s"},"s0036":{"vi":"Hôm nay trời mưa.","note":"","hz":"","en":"It's raining today.","zh":"今天下雨。","kind":"s"},"s0037":{"vi":"Anh muốn mua cà phê.","note":"","hz":"","en":"I want to buy coffee.","zh":"我想買咖啡。","kind":"s"},"s0038":{"vi":"Cho anh một ly cà phê sữa đá.","note":"ly = glass (Saigon; Hanoi: cốc); một ends with the lips closed, like \"mộc\"","hz":"","en":"One iced milk coffee, please. (literally: give me one glass of ...)","zh":"給我一杯冰奶咖啡。","kind":"s"},"s0039":{"vi":"Cho anh một tô phở.","note":"","hz":"","en":"A bowl of phở, please.","zh":"給我一碗河粉。","kind":"s"},"s0040":{"vi":"Em biết không?","note":"","hz":"","en":"Do you know?","zh":"你知道嗎？","kind":"s"},"s0041":{"vi":"Chưa, em chưa biết.","note":"","hz":"","en":"Not yet, I don't know yet.","zh":"還沒，我還不知道。","kind":"s"},"s0042":{"vi":"Anh mệt quá.","note":"","hz":"","en":"I'm so tired.","zh":"我好累。","kind":"s"},"s0043":{"vi":"dạ, dài, dễ, gì, giờ, giá","note":"d and gi are both y (as in English yes) in Saigon","hz":"","en":"yes (polite); long; easy; what; hour, time; price","zh":"是、嗯；長；容易；什麼；點、時間；價格","kind":"d"},"s0044":{"vi":"đi, đâu, đó, được","note":"đ is a real d, tongue at the teeth, with a slight inward gulp (implosive); a plain d is fine","hz":"","en":"go; where; there, that; can","zh":"去；哪裡；那、那個；可以","kind":"d"},"s0045":{"vi":"dài, đài","note":"y versus d","hz":"臺 (đài)","en":"long; station, platform (đài truyền hình = TV station)","zh":"長；台（電台、電視台）","kind":"d"},"s0046":{"vi":"dao, đào","note":"","hz":"桃 (đào)","en":"knife; peach, dig","zh":"刀；桃子、挖","kind":"d"},"s0047":{"vi":"da, đa","note":"","hz":"多 (đa)","en":"skin; many (đa số = majority)","zh":"皮膚；多（đa số 多數）","kind":"d"},"s0048":{"vi":"vui, về, vậy, và","note":"v: young urban Saigon speakers keep v in careful speech, it drifts toward y in fast speech; the Mekong Delta says y throughout. Aim for v","hz":"","en":"happy; return, go home; so, like that; and","zh":"開心；回；那樣；和","kind":"d"},"s0049":{"vi":"rồi, ra, rất, rẻ, rửa","note":"Saigon r: tongue curled back, close to an English r, not the Hanoi z. the voice says z here and that is wrong: you say the Mandarin 日, tongue curled back 錄音的 r 不對，你要唸捲舌的 日","hz":"","en":"already; go out; very; cheap; wash","zh":"了、已經；出去；很；便宜；洗","kind":"d"},"s0050":{"vi":"ra, da, gia","note":"three spellings, two sounds in Saigon: ra with r, da and gia both with y. the voice says z here and that is wrong: you say the Mandarin 日, tongue curled back 錄音的 r 不對，你要唸捲舌的 日","hz":"家 (gia)","en":"go out; skin; family (gia đình)","zh":"出去；皮膚；家（gia đình 家庭）","kind":"d"},"s0051":{"vi":"trà, chà","note":"tr: tongue curled back. ch: tongue flat behind the teeth. Keeping them apart is the careful Saigon form; fast Saigon speech and Hanoi merge them. the voice merges tr and ch here and that is the fast Saigon form: you keep them apart 錄音把 tr 和 ch 混在一起了，你要分開唸","hz":"茶 (trà)","en":"tea; rub, scrub","zh":"茶；搓、擦","kind":"d"},"s0052":{"vi":"trưa, chưa","note":"same pair on another vowel. the voice merges tr and ch here and that is the fast Saigon form: you keep them apart 錄音把 tr 和 ch 混在一起了，你要分開唸","hz":"","en":"noon; not yet","zh":"中午；還沒","kind":"d"},"s0053":{"vi":"con trai, cái chai","note":"con trai = son, cái chai = the bottle. The whole meaning hangs on tr against ch. the voice merges tr and ch here and that is the fast Saigon form: you keep them apart 錄音把 tr 和 ch 混在一起了，你要分開唸","hz":"","en":"boy, son; bottle","zh":"男孩、兒子；瓶子","kind":"d"},"s0054":{"vi":"sinh, xinh","note":"say them apart: s with the tongue curled back like Mandarin 師, x like a plain s. Fast Saigon speech and Hanoi merge them. xinh itself is Northern-flavoured; in Saigon say đẹp or dễ thương. the voice merges s and x here and that is the fast Saigon form: you keep them apart 錄音把 s 和 x 混在一起了，你要分開唸","hz":"生 (sinh)","en":"be born; pretty","zh":"生；漂亮","kind":"d"},"s0055":{"vi":"xa, sa","note":"same pair, other order. the voice merges s and x here and that is the fast Saigon form: you keep them apart 錄音把 s 和 x 混在一起了，你要分開唸","hz":"沙 (sa)","en":"far; fall, sand (sa mạc = desert)","zh":"遠；落、沙（sa mạc 沙漠）","kind":"d"},"s0056":{"vi":"tôi, thôi","note":"t = Mandarin d (no puff of air); th = Mandarin t (puff of air)","hz":"","en":"I (neutral); stop, enough, okay then","zh":"我（中性）；算了、好了","kind":"d"},"s0057":{"vi":"tiền, thiền","note":"","hz":"錢 (tiền) / 禪 (thiền)","en":"money; zen, meditation","zh":"錢；禪","kind":"d"},"s0058":{"vi":"tay, thay","note":"","hz":"","en":"hand, arm; replace, change","zh":"手；替換","kind":"d"},"s0059":{"vi":"cô, khô","note":"c = Mandarin g; kh = Mandarin k, often with friction like the ch in German \"Bach\"","hz":"姑 (cô) / 枯 (khô)","en":"aunt, Ms; dry","zh":"姑姑、小姐；乾","kind":"d"},"s0060":{"vi":"cá, khá","note":"","hz":"","en":"fish; fairly, quite","zh":"魚；相當、蠻","kind":"d"},"s0061":{"vi":"quá, quê, quen, quán","note":"say kw: quá, quê, quen, quán, the k stays. That is the careful Saigon form and what your tandem corrects you to. In fast or rural speech you will hear wá, wê, wen, wán. Hanoi also says kw, so this is about care, not about dialect 唸 kw，不是 wá。快講或鄉下腔才變 wá，這是講究程度，不是南北差別","hz":"過 (quá) / 館 (quán)","en":"too, very; hometown, countryside; be used to, know (someone); shop, café, eatery","zh":"太、非常；家鄉；熟悉、認識；店、館","kind":"d"},"s0062":{"vi":"ngon, người, nghe, nghỉ","note":"ng at the start of a syllable: the sound at the end of \"sing\", then keep going","hz":"","en":"delicious; person; hear, listen; rest","zh":"好吃；人；聽；休息","kind":"d"},"s0063":{"vi":"nhà, nhiều, nhớ, nhanh","note":"nh: Spanish ñ, the ny in \"canyon\"","hz":"","en":"house; many, much; miss, remember; fast","zh":"家；多；想念、記得；快","kind":"d"},"s0064":{"vi":"phở, phải, phim","note":"ph = f","hz":"","en":"phở; must, right; film","zh":"河粉；必須、對；電影","kind":"d"},"s0065":{"vi":"gà, ghế, ga","note":"g, gh: a soft g with friction, like the g in Spanish \"amigo\"","hz":"","en":"chicken; chair; station (ga xe lửa)","zh":"雞；椅子；車站","kind":"d"},"s0066":{"vi":"Dạ, em hiểu rồi.","note":"","hz":"曉 (hiểu)","en":"Yes, I understand now. (hiểu rồi = got it)","zh":"嗯，我懂了。","kind":"s"},"s0067":{"vi":"Anh về nhà.","note":"","hz":"","en":"I'm going home.","zh":"我回家。","kind":"s"},"s0068":{"vi":"Trưa nay ăn gì?","note":"","hz":"","en":"What do we eat at noon today?","zh":"今天中午吃什麼？","kind":"s"},"s0069":{"vi":"Cái chai này bự quá.","note":"bự = big, colloquial Southern; lớn is the neutral word; Hanoi mostly to","hz":"","en":"This bottle is huge.","zh":"這個瓶子好大。","kind":"s"},"s0070":{"vi":"Thôi, đủ rồi.","note":"","hz":"","en":"Okay, that's enough.","zh":"好了，夠了。","kind":"s"},"s0071":{"vi":"Cà phê này ngon quá.","note":"","hz":"","en":"This coffee is so good.","zh":"這杯咖啡好好喝。","kind":"s"},"s0072":{"vi":"Người Sài Gòn nói nhanh quá.","note":"","hz":"","en":"Saigon people talk so fast.","zh":"西貢人講話好快。","kind":"s"},"s0073":{"vi":"Em nói chậm chút nha.","note":"nha: soft Southern particle for requests and friendly statements, like 喔 or 吧","hz":"","en":"Speak a bit slower, please.","zh":"你講慢一點喔。","kind":"s"},"s0074":{"vi":"Anh nghe không hiểu.","note":"","hz":"","en":"I don't understand (what I'm hearing).","zh":"我聽不懂。","kind":"s"},"s0075":{"vi":"Cổ đẹp quá.","note":"cổ = cô ấy (she), Saigon contraction","hz":"","en":"She's so pretty.","zh":"她好漂亮。","kind":"s"},"s0076":{"vi":"làm, làn, làng, lành","note":"four finals: -m, -n, -ng, -nh. In Saigon làn sounds like làng, and lành like lằn: short a, n at the teeth","hz":"","en":"do, work; lane; village; benign, gentle","zh":"做；車道；村；溫和、良性","kind":"d"},"s0077":{"vi":"tin, tinh","note":"not the same word. The final is n in both, but the vowel differs: tin has a clear i, tinh pulls the vowel back toward ư, so it sounds like tưn. The palatal nh is gone in Saigon, yet it leaves its trace in the vowel, exactly as anh becomes ăn. Fast speech flattens the difference, careful speech keeps it 不是同一個字：尾音都是 n，母音不同，tinh 的母音偏 ư。The voice says both alike, which is the fast Saigon form: you pull the vowel back 錄音兩個唸一樣，你要把母音往後拉","hz":"信 (tin) / 精 (tinh)","en":"believe, news; refined, spirit (tinh thần)","zh":"相信、消息；精（tinh thần 精神）","kind":"d"},"s0078":{"vi":"chín, chính","note":"same rule as tin and tinh: chín has a clear i, chính pulls the vowel toward ư. The n at the end is the same in both. This is the careful Saigon difference, not a Northern one: Hanoi keeps the difference in the final consonant instead, n against ng 母音不同：chính 偏 ư，尾音都是 n。The voice says both alike, which is the fast Saigon form: you pull the vowel back 錄音兩個唸一樣，你要把母音往後拉","hz":"正 (chính)","en":"nine; main, exactly (chính xác)","zh":"九；正（chính xác 正確）","kind":"d"},"s0079":{"vi":"một, mộc","note":"these two really are the same in Saigon: after o, ô, u a final t turns into a k and the lips close. That is a Southern feature, not carelessness, and it stays","hz":"木 (mộc)","en":"one; wood (Sino)","zh":"一；木","kind":"d"},"s0080":{"vi":"mắt, mắc","note":"really the same in Saigon: after ă a final t turns into a k. A Southern feature, not carelessness, and it stays; Hanoi keeps t and c apart","hz":"","en":"eye; expensive (Southern; Hanoi: đắt)","zh":"眼睛；貴（南部說 mắc）","kind":"d"},"s0081":{"vi":"tiếc, tiết","note":"really the same in Saigon: after iê a final t turns into a k. A Southern feature, not carelessness, and it stays; Hanoi keeps t and c apart","hz":"節 (tiết)","en":"regret, pity (tiếc quá); period, section (tiết học); tiết kiệm = save, economise","zh":"可惜；節（tiết học 一節課；tiết kiệm 節儉、節省）","kind":"d"},"s0082":{"vi":"tập, tất, tách","note":"tập: the lips close and stay closed; tất: in Saigon a k, like tấc; tách: a cut t with a short a, [tắt]. No puff of air, no release","hz":"習 (tập)","en":"practise; all (tất cả; for socks Saigon says vớ, Hanoi tất); cup","zh":"練習；全部（tất cả；襪子南部說 vớ，北部說 tất）；杯子","kind":"d"},"s0083":{"vi":"học, tốt, đẹp, sách","note":"all four end in a stopped consonant; such syllables only take the sắc or nặng tone","hz":"學 (học) / 冊 (sách)","en":"study; good; beautiful; book","zh":"學習；好；漂亮；書","kind":"d"},"s0084":{"vi":"không, ông, đúng, uống","note":"after o, ô, u as the whole vowel, the final -ng closes the lips as well, like \"ngm\": không, ông, đúng. In uống the vowel is uô and ends open, so the lips do not close","hz":"","en":"no, not; grandfather, Mr; correct; drink","zh":"不；爺爺、先生；對；喝","kind":"d"},"s0085":{"vi":"học, đọc, cục, tốc","note":"after o, ô, u the final -c closes the lips too: like \"kp\"","hz":"學 (học) / 讀 (đọc) / 速 (tốc)","en":"study; read; lump, piece; speed (tốc độ)","zh":"學；讀；塊；速（tốc độ 速度）","kind":"d"},"s0086":{"vi":"anh, xanh, nhanh, khách","note":"-anh in Saigon: short a plus n at the teeth, [ăn]; -ach: short a plus a cut t, [ăt]","hz":"客 (khách)","en":"older brother, you; blue, green; fast; guest, customer","zh":"哥哥、你；藍、綠；快；客人","kind":"d"},"s0087":{"vi":"bệnh, kênh, ếch","note":"-ênh and -êch in Saigon: the palatal final becomes n and t, and the vowel pulls back toward ơ, so bệnh sounds close to bợn. You say bệnh; you will hear bịnh in the South, especially from older speakers. The voice keeps a clear ê here: you pull the vowel toward ơ 錄音的 ê 太清楚，你要把母音往 ơ 拉。","hz":"病 (bệnh)","en":"sick, illness; channel; frog","zh":"病；頻道；青蛙","kind":"d"},"s0088":{"vi":"một, hai, ba, bốn, năm, sáu, bảy, tám, chín, mười","note":"","hz":"","en":"one to ten","zh":"一到十","kind":"s"},"s0089":{"vi":"Anh ăn cơm rồi.","note":"ăn sounds like \"ăng\"","hz":"","en":"I've eaten already.","zh":"我吃過飯了。","kind":"s"},"s0090":{"vi":"Chín giờ tối.","note":"","hz":"","en":"Nine in the evening.","zh":"晚上九點。","kind":"s"},"s0091":{"vi":"Cái này mắc quá.","note":"","hz":"","en":"This is too expensive.","zh":"這個太貴了。","kind":"s"},"s0092":{"vi":"Anh học tiếng Việt.","note":"","hz":"學 (học) / 越 (Việt)","en":"I'm learning Vietnamese.","zh":"我在學越南語。","kind":"s"},"s0093":{"vi":"Em nói được tiếng Anh không?","note":"","hz":"英 (Anh)","en":"Can you speak English?","zh":"你會說英語嗎？","kind":"s"},"s0094":{"vi":"Sách này hay lắm.","note":"","hz":"冊 (sách)","en":"This book is really good.","zh":"這本書很好看。","kind":"s"},"s0095":{"vi":"Không sao đâu.","note":"","hz":"","en":"No problem. / It's fine.","zh":"沒關係。","kind":"s"},"s0096":{"vi":"Anh không hiểu.","note":"","hz":"","en":"I don't understand.","zh":"我不懂。","kind":"s"},"s0097":{"vi":"Anh là người Đức.","note":"","hz":"德 (Đức)","en":"I'm German.","zh":"我是德國人。","kind":"s"},"s0098":{"vi":"Anh là giáo viên tiếng Đức.","note":"","hz":"教員 (giáo viên) / 德 (Đức)","en":"I'm a German teacher.","zh":"我是德語老師。","kind":"s"},"s0099":{"vi":"Anh dạy tiếng Đức cho người Trung Quốc.","note":"người Trung Quốc = from China; người Hoa = ethnic Chinese in general, also the Chinese-Vietnamese in Saigon","hz":"中國 (Trung Quốc)","en":"I teach German to Chinese people.","zh":"我教中國人德語。","kind":"s"},"s0100":{"vi":"Ba anh là người Việt.","note":"","hz":"越 (Việt)","en":"My dad is Vietnamese.","zh":"我爸是越南人。","kind":"s"},"s0101":{"vi":"Má anh là người Trung Quốc.","note":"","hz":"中國 (Trung Quốc)","en":"My mom is Chinese.","zh":"我媽是中國人。","kind":"s"},"s0102":{"vi":"Anh nói được tiếng Trung.","note":"in Saigon \"tiếng Hoa\" is just as common for the Chinese language","hz":"中 (Trung)","en":"I can speak Chinese.","zh":"我會說中文。","kind":"s"},"s0103":{"vi":"Anh mới học tiếng Việt.","note":"","hz":"","en":"I just started learning Vietnamese.","zh":"我剛開始學越南語。","kind":"s"},"s0104":{"vi":"Anh ở Đức.","note":"","hz":"德 (Đức)","en":"I live in Germany.","zh":"我住在德國。","kind":"s"},"s0105":{"vi":"Em ở đâu?","note":"","hz":"","en":"Where are you? / Where do you live?","zh":"你在哪裡？","kind":"s"},"s0106":{"vi":"Em ở Sài Gòn hả?","note":"hả: question particle for checking or mild surprise, like 喔 or 是嗎","hz":"","en":"You're in Saigon?","zh":"你在西貢喔？","kind":"s"},"s0107":{"vi":"Em làm nghề gì?","note":"","hz":"","en":"What do you do for a living?","zh":"你做什麼工作？","kind":"s"},"s0108":{"vi":"Em là sinh viên hả?","note":"","hz":"生員 (sinh viên)","en":"You're a student?","zh":"你是大學生喔？","kind":"s"},"s0109":{"vi":"Ổng là ba anh.","note":"ổng = ông ấy (he, an older man), Saigon contraction","hz":"","en":"He is my dad.","zh":"他是我爸。","kind":"s"},"s0110":{"vi":"Ảnh là người Sài Gòn.","note":"ảnh = anh ấy (he), Saigon contraction","hz":"","en":"He's from Saigon.","zh":"他是西貢人。","kind":"s"},"s0111":{"vi":"Cổ là bạn anh.","note":"","hz":"伴 (bạn)","en":"She's my friend.","zh":"她是我朋友。","kind":"s"},"s0112":{"vi":"Thiệt hả?","note":"thiệt: say this (Southern); Hanoi and writing: thật","hz":"實 (thật)","en":"Really?","zh":"真的嗎？","kind":"s"},"s0113":{"vi":"Vậy hả?","note":"","hz":"","en":"Is that so? / Oh really?","zh":"是喔？","kind":"s"},"s0114":{"vi":"Trời ơi, mắc quá!","note":"","hz":"","en":"Oh my god, so expensive!","zh":"天啊，好貴！","kind":"s"},"s0115":{"vi":"Em nói lại được không?","note":"","hz":"","en":"Can you say that again?","zh":"你可以再說一次嗎？","kind":"s"},"s0116":{"vi":"Thôi, anh đi ngủ nha.","note":"","hz":"","en":"Okay, I'm going to sleep now.","zh":"好了，我去睡了喔。","kind":"s"},"s0117":{"vi":"Ngủ ngon nghen.","note":"nghen: warm Southern particle, softer than nha; it sounds older or Mekong and fits your father; with tandems nha is the usual choice","hz":"","en":"Sleep well.","zh":"晚安喔。","kind":"s"},"s0118":{"vi":"Mai nói tiếp nha.","note":"","hz":"","en":"Let's talk more tomorrow.","zh":"明天再聊喔。","kind":"s"},"s0119":{"vi":"Hẹn gặp lại.","note":"","hz":"","en":"See you again.","zh":"再見。","kind":"s"}},"lessons":[{"key":"l01","n":1,"title":"The Saigon sound system","ids":["s0001","s0002","s0003","s0004","s0005","s0006","s0007","s0008","s0009","s0010","s0120","s0121","s0011","s0012","s0013","s0014","s0015","s0016","s0017","s0018","s0019","s0020","s0021","s0022","s0023","s0024","s0025","s0026","s0027","s0028","s0029","s0030","s0031","s0032","s0033","s0034","s0035","s0036","s0037","s0038","s0039","s0040","s0041","s0042","s0043","s0044","s0045","s0046","s0047","s0048","s0049","s0050","s0051","s0052","s0053","s0054","s0055","s0056","s0057","s0058","s0059","s0060","s0061","s0062","s0063","s0064","s0065","s0066","s0067","s0068","s0069","s0070","s0071","s0072","s0073","s0074","s0075","s0076","s0077","s0078","s0079","s0080","s0081","s0082","s0083","s0084","s0085","s0086","s0087","s0088","s0089","s0090","s0091","s0092","s0093","s0094","s0095","s0096","s0097","s0098","s0099","s0100","s0101","s0102","s0103","s0104","s0105","s0106","s0107","s0108","s0109","s0110","s0111","s0112","s0113","s0114","s0115","s0116","s0117","s0118","s0119"],"drills":["s0011","s0012","s0013","s0014","s0015","s0016","s0017","s0018","s0019","s0020","s0021","s0022","s0023","s0024","s0025","s0026","s0027","s0028","s0029","s0030","s0031","s0032","s0033","s0034","s0043","s0044","s0045","s0046","s0047","s0048","s0049","s0050","s0051","s0052","s0053","s0054","s0055","s0056","s0057","s0058","s0059","s0060","s0061","s0062","s0063","s0064","s0065","s0076","s0077","s0078","s0079","s0080","s0081","s0082","s0083","s0084","s0085","s0086","s0087"],"pages":[{"t":"How this app works","h":"<p>Every day there is one round of fifteen minutes; you can change the minutes on the home screen. First the sentences that are due again, then as many new ones as fit. If the reviews pile up, the new sentences wait until they are through.<\/p>\n<p>Nothing plays by itself, and you never have to press Play to go on. Press Play, say the sentence in the pause, press Play again and say it on top of the voice, as often as you like. Then <b>Again<\/b> if it did not come out, <b>Got it<\/b> if it came out fluently. Again brings the card back a few cards later; Got it sends it further into the future each time.<\/p>\n<p>Once you have pressed Got it for a sentence three times (twice for the lesson 1 sentences, which start one step in), it comes as its meaning only. Say it in Vietnamese, out loud, then press Check and compare with the voice.<\/p>\n<p>The rows of single words from the booklet, the sound drills, are not practised in the app, except the numbers one to ten. They stay in the sentence list and on these pages, to listen to whenever you like.<\/p>\n<p>Slow plays the sentence at three quarters of the speed, same pitch. A dotted syllable means the voice gets that sound wrong; tap it to see what you say instead.<\/p>\n<p>After the round comes the tandem task. On Fridays there is a short check-in, and the next lesson is built from it.<\/p>\n<p>You studied lesson 1 from the booklet. Its 62 sentences are already counted as met and come back as reviews over the first five days, in the order of the old booklet days.<\/p>"},{"t":"The five Saigon tones","h":"<p>Vietnamese spelling shows six tones. Saigon has five, because hỏi (ả) and ngã (ã) are pronounced the same. Your Mandarin gives you the categories; the contours are not the Mandarin ones.<\/p>\n<div class=\"tw\"><table><tr><th>tone<\/th><th>mark<\/th><th>Saigon contour<\/th><th>Mandarin comparison<\/th><\/tr><tr><td>ngang<\/td><td>none<\/td><td>mid, flat<\/td><td>like tone 1 but lower, 33 rather than 55<\/td><\/tr><tr><td>huyền<\/td><td>à<\/td><td>low, falling gently, relaxed<\/td><td>not tone 4: it starts low and falls softly, no force<\/td><\/tr><tr><td>sắc<\/td><td>á<\/td><td>rising<\/td><td>tone 2, nearly identical; on syllables ending in p, t, c, ch it is short and high<\/td><\/tr><tr><td>hỏi / ngã<\/td><td>ả, ã<\/td><td>dips, then rises, longer than the others<\/td><td>a full tone 3 (214), the one you use in isolation<\/td><\/tr><tr><td>nặng<\/td><td>ạ<\/td><td>low, falling, a slight rise at the end, no catch in the throat; short only on syllables ending in p, t, c, ch<\/td><td>the half third tone, like 好 in 好吃<\/td><\/tr><\/table><\/div>\n<p>Listen for how low nặng sits, how long hỏi is, and that huyền has no energy in it.<\/p>\n<p><button class=\"pl\" data-id=\"s0011\"><\/button><button class=\"pl\" data-id=\"s0012\"><\/button><button class=\"pl\" data-id=\"s0013\"><\/button><button class=\"pl\" data-id=\"s0014\"><\/button><button class=\"pl\" data-id=\"s0015\"><\/button><\/p>\n<p>If the voice makes a break in the middle of ngã words (cũng, nữa, mã), that is the Northern realisation. The app does not dot these; just say them exactly like the hỏi words.<\/p>\n<h3>Pronouns<\/h3>\n<p>anh = I (a man, to someone younger) and also you (when they address you). em = you (to someone younger) and I (when they speak). Your tandems call you anh and themselves em; you do the reverse. tôi is the neutral I; tui, mình, bạn and the rest come in lesson 4.<\/p>\n<h3>Greetings<\/h3>\n<p>Greetings are said fast and low in Saigon. Chào em is said quickly, as one unit. Dạ is not \"yes\" in the German sense; it shows that you are listening politely, and it starts almost every answer to someone you want to be polite to.<\/p>"},{"t":"Vowels","h":"<p>Twelve vowel letters (i and y share a sound), six of them with a hook or hat that changes the sound entirely. German gives you most of the qualities; the danger is length. Vietnamese a is long, ă and â are short, and length is not decorative: mắt, mất, mát are three words.<\/p>\n<div class=\"tw\"><table><tr><th>letters<\/th><th>sound<\/th><th>nearest German or Mandarin sound<\/th><\/tr><tr><td>a<\/td><td>long, open<\/td><td>Bahn<\/td><\/tr><tr><td>ă<\/td><td>same quality, very short, clipped<\/td><td>the a in \"hat\", cut even shorter<\/td><\/tr><tr><td>â<\/td><td>short, central, mouth half closed<\/td><td>the e in \"bitte\", or Mandarin 恩 without the n<\/td><\/tr><tr><td>e<\/td><td>open<\/td><td>Bett<\/td><\/tr><tr><td>ê<\/td><td>closed<\/td><td>Beet, Mandarin 欸<\/td><\/tr><tr><td>i, y<\/td><td>same sound, spelling only<\/td><td>Mandarin 一<\/td><\/tr><tr><td>o<\/td><td>open, rounded<\/td><td>offen<\/td><\/tr><tr><td>ô<\/td><td>closed, rounded<\/td><td>Ofen, Mandarin 喔<\/td><\/tr><tr><td>ơ<\/td><td>unrounded ô, mouth relaxed, long<\/td><td>English \"bird\" without the r; â is its short partner<\/td><\/tr><tr><td>u<\/td><td>closed, rounded<\/td><td>Mandarin 烏<\/td><\/tr><tr><td>ư<\/td><td>u with the lips spread as for i<\/td><td>no clean match; start from u and unround<\/td><\/tr><\/table><\/div>\n<p><button class=\"pl\" data-id=\"s0020\"><\/button><button class=\"pl\" data-id=\"s0025\"><\/button><\/p>\n<h3>Glides<\/h3>\n<p>ia, ua, ưa at the end of a syllable are i, u, ư gliding into a lazy ơ. Before a final consonant they are written iê, uô, ươ and sound the same. So bia and biết share the same first half, and mua and muốn do too. In Saigon you will often hear them shrink before i, u, m, p: người like ngừi, hiểu like hỉu.<\/p>\n<p>Take the minimal sets slowly: three words, three lengths. If mất and mắt come out the same, you are lengthening ă; keep it as short as the voice does.<\/p>"},{"t":"Initial consonants","h":"<p>This is where Saigon and Hanoi differ most, and where your Mandarin does the most work.<\/p>\n<div class=\"tw\"><table><tr><th>spelling<\/th><th>Saigon sound<\/th><th>Mandarin or German anchor<\/th><\/tr><tr><td>d, gi<\/td><td>y as in \"yes\"<\/td><td>Mandarin 一 onset (yī)<\/td><\/tr><tr><td>đ<\/td><td>a real d, with a slight inward gulp<\/td><td>German d is accepted<\/td><\/tr><tr><td>v<\/td><td>v<\/td><td>German w<\/td><\/tr><tr><td>r<\/td><td>tongue curled back, close to an English r<\/td><td>Mandarin r in 日<\/td><\/tr><tr><td>tr<\/td><td>curled-back t, like Mandarin zh<\/td><td>知<\/td><\/tr><tr><td>ch<\/td><td>flat t-plus-sh, like Mandarin j<\/td><td>機<\/td><\/tr><tr><td>s<\/td><td>curled-back s, like Mandarin sh<\/td><td>是<\/td><\/tr><tr><td>x<\/td><td>plain s<\/td><td>Mandarin s, 四<\/td><\/tr><tr><td>t<\/td><td>unaspirated t<\/td><td>Mandarin d, 大<\/td><\/tr><tr><td>th<\/td><td>aspirated t<\/td><td>Mandarin t, 他<\/td><\/tr><tr><td>c, k<\/td><td>unaspirated k<\/td><td>Mandarin g, 個<\/td><\/tr><tr><td>kh<\/td><td>aspirated k with friction<\/td><td>Mandarin k or h, German ch in \"Bach\"<\/td><\/tr><tr><td>qu<\/td><td>kw: careful Saigon keeps the k, quá and not wá<\/td><td>Mandarin 瓜 (guā)<\/td><\/tr><tr><td>ng, ngh<\/td><td>the ng of \"sing\", at the start<\/td><td>German \"Angst\" without the A<\/td><\/tr><tr><td>nh<\/td><td>ñ<\/td><td>Spanish \"señor\"<\/td><\/tr><tr><td>ph<\/td><td>f<\/td><td>Mandarin f<\/td><\/tr><tr><td>g, gh<\/td><td>soft g with friction<\/td><td>Spanish \"amigo\"<\/td><\/tr><tr><td>b<\/td><td>b with a slight inward gulp<\/td><td>German b is accepted<\/td><\/tr><\/table><\/div>\n<p>The two big habits to fight are German ones. First, German t, p, k are aspirated at the start of a word; Vietnamese t, c are not, and th, kh are. Use your Mandarin pairs d/t and g/k, they map exactly. Second, German has no ng at the beginning of a syllable. Say \"singen\", stop after \"sing\", then start \"ngon\" from that position.<\/p>\n<p><button class=\"pl\" data-id=\"s0043\"><\/button><button class=\"pl\" data-id=\"s0049\"><\/button><button class=\"pl\" data-id=\"s0061\"><\/button><\/p>\n<h3>Saigon versus the written form<\/h3>\n<p>d, gi and r are three spellings that Hanoi reads as one sound (z). Saigon reads d and gi as y and keeps r apart. That is why a Saigon speaker hears the difference between ra and da, and why you should too.<\/p>\n<p>The minimal pairs are for your ear as much as your mouth. When you play one on these pages, listen three times before you say it.<\/p>"},{"t":"Careful Saigon, fast Saigon, Hanoi","h":"<p>Three things get mixed up under the word \"correct\", so hold them apart.<\/p>\n<p>The first is care. Inside Saigon there is a careful form and a fast form of the same accent. Careful keeps the k in qu (quá, not wá), keeps v as v (về, not yề), keeps s apart from x and tr apart from ch. Fast speech drops all four. Careful Saigon is what you produce, because it is never wrong in any situation, and because dropping a distinction later costs nothing while adding one costs months.<\/p>\n<p>The second is dialect. d and gi are y in the South and z in the North. r is curled back in the South and z in the North. The five tones with hỏi and ngã falling together are Southern, and so are the finals: một sounds like mộc, and tinh loses its nh but keeps a trace of it in the vowel. None of this is carelessness and none of it gets \"corrected\". You never produce the Northern forms; they are named in the notes so that you understand a Hanoi speaker, nothing more.<\/p>\n<p>The trap sits where the two meet. qu with its k sounds the same in careful Saigon and in Hanoi, so someone might tell you that the careful form is the Northern one. It is not, it is simply the careful one. But if a correction ever asks you to say dạ as zạ, or to split hỏi from ngã, that is not care any more, that is the Hanoi accent, and you decline it: your goal is to sound like a Saigon speaker in their twenties, not like a news reader from the North.<\/p>"},{"t":"Final consonants","h":"<p>Neither Mandarin nor German prepares you for Vietnamese finals. Mandarin has only n and ng at the end; German has every consonant but releases them with a puff. Vietnamese has eight finals and never releases the stops.<\/p>\n<div class=\"tw\"><table><tr><th>final<\/th><th>how<\/th><th>Saigon<\/th><\/tr><tr><td>-m<\/td><td>close the lips, hum<\/td><td>same as written<\/td><\/tr><tr><td>-n<\/td><td>tongue at the teeth<\/td><td>after every vowel except i and ê it becomes -ng<\/td><\/tr><tr><td>-ng<\/td><td>back of the tongue<\/td><td>after o, ô, u the lips close at the same moment: \"ngm\"<\/td><\/tr><tr><td>-nh<\/td><td>the nh of nhà, at the end<\/td><td>after a: anh is [ăn], short a and n at the teeth; after i and ê: n, and the vowel pulls back toward ư or ơ<\/td><\/tr><tr><td>-p, -t, -c, -ch<\/td><td>stop, hold, no release, no puff<\/td><td>the syllable ends in silence<\/td><\/tr><tr><td>-t<\/td><td>tongue at the teeth, no release<\/td><td>after every vowel except i and ê it becomes -c<\/td><\/tr><tr><td>-c<\/td><td>back of the tongue, no release<\/td><td>after o, ô, u the lips close too: \"kp\"<\/td><\/tr><tr><td>-ch<\/td><td>a stopped nh<\/td><td>after a: sách is [sắt], short a and a cut t; after i and ê: a cut t, the vowel pulls back the same way<\/td><\/tr><\/table><\/div>\n<h3>What sounds the same, and what only nearly does<\/h3>\n<p>These pairs really are the same in Saigon, and your tandems will say them that way:<\/p>\n<ul><li>ăn = ăng, bàn = bàng, tiền = tiềng (-n becomes -ng)<\/li><li>mắt = mắc, một = mộc, tiết = tiếc (-t becomes -c)<\/li><\/ul>\n<p>These are not the same, although fast speech and the voice flatten them:<\/p>\n<ul><li>tin and tinh, chín and chính, xin and xinh. The final is n in both, but tinh pulls the vowel back toward ư, so it sounds like tưn, and chính like chứn. Two words, kept apart in careful speech.<\/li><li>bệnh, kênh, ếch: after ê the vowel pulls toward ơ, so bệnh is close to bợn.<\/li><\/ul>\n<p>anh ends in a real n at the teeth, [ăn]; ăn ends in ng, [ăng]. They differ only in the final, the other way round from what the spelling suggests. sách ends in a cut t, [sắt]; sát itself ends in c, [sác]. This is why your spelling will be learned from reading, not from hearing.<\/p>\n<p><button class=\"pl\" data-id=\"s0076\"><\/button><button class=\"pl\" data-id=\"s0077\"><\/button><button class=\"pl\" data-id=\"s0079\"><\/button><\/p>\n<h3>Stopped syllables and tone<\/h3>\n<p>A syllable ending in p, t, c, ch can only carry sắc or nặng: short high, or short low. Listen to học, tốt, đẹp, sách: two are high, two are low, all four are cut. If a final sounds like a German word ending, with a small puff after the t, cut the air off with the tongue or lips and leave it there.<\/p>\n<h3>Numbers<\/h3>\n<p>One to ten as a row, because they are a finals drill in disguise: một (t said as c, lips close), bốn (n said as ng, lips close), năm and tám (m), chín (n at the teeth, clear i, not chính), mười (full glide in careful speech; you will hear mừi). Say them as a chain until they run.<\/p>\n<p><button class=\"pl\" data-id=\"s0088\"><\/button><\/p>"},{"t":"Who you are, in Saigon Vietnamese","h":"<p>The sounds now carry content: the self-introduction you send to every tandem, plus the Saigon contractions and particles that make it sound like Saigon rather than a textbook.<\/p>\n<h3>The persona sentences<\/h3>\n<p><button class=\"pl\" data-id=\"s0097\"><\/button><button class=\"pl\" data-id=\"s0098\"><\/button><button class=\"pl\" data-id=\"s0099\"><\/button><button class=\"pl\" data-id=\"s0100\"><\/button><button class=\"pl\" data-id=\"s0101\"><\/button><button class=\"pl\" data-id=\"s0102\"><\/button><button class=\"pl\" data-id=\"s0103\"><\/button><\/p>\n<p>Seven sentences, and they answer the first seven questions every Vietnamese person asks. Learn them as one block.<\/p>\n<p>Note ba and má: that is how the South says dad and mom. Hanoi says bố and mẹ; you will read those, never say them.<\/p>\n<h3>Saigon contractions<\/h3>\n<p>anh ấy becomes ảnh, cô ấy becomes cổ, ông ấy becomes ổng, bà ấy becomes bả, chị ấy becomes chỉ. The tone of ấy folds into the first word as a hỏi tone. In casual Saigon speech everyone says these; the full forms belong to polite or formal speech.<\/p>\n<h3>Particles<\/h3>\n<ul><li>hả at the end turns a statement into a checking question: Em ở Sài Gòn hả? Like 是喔 or 嗎 with a raised eyebrow.<\/li><li>nha softens a request or a statement: Em nói chậm chút nha. Close to 喔 or 吧. It is soft and short; do not stress it.<\/li><li>nghen is the warmer, more familiar nha: Ngủ ngon nghen. It sounds older or Mekong; it fits your father, while tandems in their twenties write nha.<\/li><li>Thiệt hả? and Vậy hả? are the two reactions you will hear most in a chat. Thiệt is the Southern form of thật.<\/li><\/ul>\n<h3>Mandarin bridge<\/h3>\n<p>Anh là người Đức = 我是德國人, but inside người Đức the order flips: person first, then German. Anh nói được tiếng Trung: được after the verb is like 得 in 聽得懂, or simply 會, \"can, manage to\". Trung Quốc is 中國 read in Hán Việt: 中 = trung, 國 = quốc.<\/p>"},{"t":"Four places where you beat the voice","h":"<p>The voice is a model, not a person from Saigon, and it gets four sounds wrong. In the app every syllable with r, tr, s or a palatal final after i or ê is dotted; tap it to see what you say instead.<\/p>\n<p>The r comes out as a z. You say it curled back like the Mandarin 日: ra, not za.<\/p>\n<p>tr and ch sound the same in the voice. You keep them apart: tr curled back, ch flat behind the teeth. con trai and cái chai are two different things.<\/p>\n<p>s and x sound the same in the voice. You keep them apart: s curled back like 師, x a plain s.<\/p>\n<p>chín and chính sound the same in the voice. The final n really is the same in both, but the vowel is not: chín has a clear i, chính pulls toward ư. The same with tin and tinh, and after ê the trace goes toward ơ.<\/p>\n<p>Listen to these four once, deliberately. Then you know them for the rest of the course.<\/p>\n<p><button class=\"pl\" data-id=\"s0049\"><\/button><button class=\"pl\" data-id=\"s0051\"><\/button><button class=\"pl\" data-id=\"s0054\"><\/button><button class=\"pl\" data-id=\"s0078\"><\/button><\/p>"}],"tandem":"<p>If you have not done it yet: send the seven persona sentences to one tandem as one message, with Em ở Sài Gòn hả? at the end, and ask them to correct anything. Paste their answer into Friday's check-in.<\/p>\n<p>Otherwise, one or two short messages with what you have: Chào em, Cảm ơn em, Thiệt hả?, Vậy hả?, Mai nói tiếp nha, Ngủ ngon nha.<\/p>","startDay":{"s0001":1,"s0002":1,"s0003":1,"s0004":1,"s0005":1,"s0006":1,"s0007":1,"s0008":1,"s0009":1,"s0010":1,"s0120":1,"s0121":1,"s0011":1,"s0012":1,"s0013":1,"s0014":1,"s0015":1,"s0016":1,"s0017":1,"s0018":1,"s0019":1,"s0020":2,"s0021":2,"s0022":2,"s0023":2,"s0024":2,"s0025":2,"s0026":2,"s0027":2,"s0028":2,"s0029":2,"s0030":2,"s0031":2,"s0032":2,"s0033":2,"s0034":2,"s0035":2,"s0036":2,"s0037":2,"s0038":2,"s0039":2,"s0040":2,"s0041":2,"s0042":2,"s0043":3,"s0044":3,"s0045":3,"s0046":3,"s0047":3,"s0048":3,"s0049":3,"s0050":3,"s0051":3,"s0052":3,"s0053":3,"s0054":3,"s0055":3,"s0056":3,"s0057":3,"s0058":3,"s0059":3,"s0060":3,"s0061":3,"s0062":3,"s0063":3,"s0064":3,"s0065":3,"s0066":3,"s0067":3,"s0068":3,"s0069":3,"s0070":3,"s0071":3,"s0072":3,"s0073":3,"s0074":3,"s0075":3,"s0076":4,"s0077":4,"s0078":4,"s0079":4,"s0080":4,"s0081":4,"s0082":4,"s0083":4,"s0084":4,"s0085":4,"s0086":4,"s0087":4,"s0088":4,"s0089":4,"s0090":4,"s0091":4,"s0092":4,"s0093":4,"s0094":4,"s0095":4,"s0096":4,"s0097":5,"s0098":5,"s0099":5,"s0100":5,"s0101":5,"s0102":5,"s0103":5,"s0104":5,"s0105":5,"s0106":5,"s0107":5,"s0108":5,"s0109":5,"s0110":5,"s0111":5,"s0112":5,"s0113":5,"s0114":5,"s0115":5,"s0116":5,"s0117":5,"s0118":5,"s0119":5}}]};
const CORE = (function () {
// core.js: the learning logic, no DOM. Used by the app (build.py inlines it) and by app/tests.
// Scheduling is ported from the kids' app (~/Documents/quizzes/src/engine.js): boxes 1 to 9, own interval
// and ease per card, a forgotten sure card falls back two boxes, problem cards stay in box 2.
// Differences: every day is a practice day (Mike, 1 Oct 2026), the round is limited by time, not by card count,
// and the grade comes from two buttons (Again / Got it), because the app cannot hear you.

const INTERVAL = {1: 1, 2: 2, 3: 4, 4: 8, 5: 15, 6: 30, 7: 60, 8: 120, 9: 240};   // in days
const MAX_BOX = 9, SURE_BOX = 4, RECALL_BOX = 3, DRILL_DONE_BOX = 4;
const LEECH_MISS = 5, LEECH_OK = 3;
const MINUTES = [10, 15, 20, 30], MIN_DEFAULT = 15;   // Mike 2026-10-01: every day, 15 minutes, changeable on the home screen

    if (box) { box.innerHTML = vm.dataset.m.split(" ").map(k => "<p>" + esc(MARK_TEXT[k]) + "</p>").join(""); box.style.display = "block"; e.stopImmediatePropagation(); return; }
  }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "play") { play(b.dataset.id, b.dataset.slow === "1"); e.stopPropagation(); }

// ================= screens =================
let cur = "home";
function onCard() { return cur === "card"; }
function show(name, arg) {
  if (name !== "listen") stopListen();
  if (name !== cur) stopAudio();
  cur = name;
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === name));
  ({home: renderHome, card: renderCard, tandem: renderTandem, checkin: renderCheckin, listen: renderListen, library: renderLibrary, lessons: renderLessons, page: renderPage})[name](arg);
  window.scrollTo(0, 0);
}

// ----- home -----
function weekSnapshot(t) {
  const mo = monday(t), sure = sureCount(S, D);
  if (!S.wk || S.wk.w !== mo) { const prevGain = S.wk && S.wk.w === mo - 7 ? sure - S.wk.start : null; S.wk = {w: mo, start: sure, prev: prevGain}; persist(); }
  return {sure, gain: sure - S.wk.start, prev: S.wk.prev};
}
function weekDots(t) {
  const real = dayOf(Date.now()), mo = monday(real), names = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const first = Math.min(...Object.values(S.cards).map(c => c.born).filter(x => x != null), real);   // days before the app existed are not missed
  let n = 0;
  const dots = names.map((nm, i) => {
    const d = mo + i, log = (S.days || {})[d], ok = log && log.done, missed = !ok && d < real && d >= first;
    if (ok) n++;
    return '<div class="dot"><span class="' + (ok ? "ok" : missed ? "miss" : "") + '">' + (ok ? "✓" : missed ? "✕" : "") + "</span><small" + (d === real ? ' class="now"' : "") + ">" + nm + "</small></div>";
  }).join("");
  return {html: '<div class="dots">' + dots + "</div>", n};
}
// A finished round from an earlier day whose tandem step was never ticked still counts as a practice day.
function settleOldRound(t) {
  const R = S.round;
  if (R && R.day < t && roundDone(R) && !R.tandem) { R.tandem = "open"; dayLog(S, R.day).done = true; save(); }
}
function roundLesson() { return (S.round && D.lessons.find(x => x.key === S.round.lesson)) || currentLesson(S, D); }
function renderHome() {
  const t = today(); settleOldRound(t);
  const real = dayOf(Date.now()), L = currentLesson(S, D), R = S.round && S.round.day === t ? S.round : null;
  const pending = nextNew(S, D).length, introNeeded = pending && !(S.introRead || {})[L.key];
  let main = "";
  if (introNeeded) {
    main = '<div class="kicker">New lesson</div><h2>' + esc(L.title) + '</h2><p>Read the introduction first, then the new sentences start.</p>' +
      '<button class="btn primary big" data-act="lesson" data-key="' + L.key + '">Read the introduction</button>';
  }
  if (R && roundDone(R) && R.tandem) {
    const nc = R.items.filter(x => !x.retry).length, mn = Math.max(1, Math.round(R.ms / 60000));
    main += '<div class="kicker">Today</div><h2>Done for today.</h2><p>' + nc + (nc === 1 ? " card in " : " cards in ") + mn + (mn === 1 ? " minute." : " minutes.") + " Next round tomorrow.</p>";
  } else if (R && roundDone(R)) {
    main += '<div class="kicker">Today</div><h2>Round finished.</h2><p>One thing left: the tandem task.</p><button class="btn primary big" data-act="go" data-to="tandem">Tandem task</button>';
  } else if (R) {
    main += '<div class="kicker">Today</div><h2>Round in progress</h2><p>Card ' + (R.pos + 1) + " of " + R.items.length + ".</p>" +
      '<button class="btn primary big" data-act="start">Continue</button>';
  } else {
    const P = buildRound(S, D, t), nNew = P.items.filter(x => x.m === "new").length, nRev = P.items.length - nNew, min = Math.max(1, Math.round(P.est / 60000));
    if (!P.items.length) {   // nothing to do counts as a done day, not as a missed one
      const log = dayLog(S, t); if (!log.done && !introNeeded) { log.done = true; log.free = true; save(); }
      main += '<div class="kicker">Today</div><h2>Nothing due today.</h2>';
    }
    else main += '<div class="kicker">Today</div><h2>About ' + min + " minutes</h2><p>" +
      nRev + (nRev === 1 ? " review" : " reviews") + (nNew ? ", " + nNew + " new" : "") + (P.backlog ? ". " + P.backlog + " more are waiting, new sentences pause until they are through." : ".") + "</p>" +
      '<button class="btn primary big" data-act="start">Start</button>';
  }
  if (!pending && !introNeeded && D.lessons.indexOf(L) === D.lessons.length - 1) main += '<p class="muted">Lesson ' + L.n + " is fully in. Lesson " + (L.n + 1) + " comes after your Friday check-in.</p>";
  const w = weekSnapshot(t), dots = weekDots(t);
  const wk = '<div class="kicker">This week</div>' + dots.html + '<p class="muted">' + dots.n + " of 7 days. " + w.sure + " sentences sure" +
    (w.gain > 0 ? ", " + w.gain + " more than on Monday" : "") + (w.prev != null ? ". Last week: " + (w.prev >= 0 ? "+" : "") + w.prev + "." : ".") + "</p>";
  const ci = S.checkins && S.checkins[isoDate(monday(t))], mins = (S.cfg && S.cfg.min) || MIN_DEFAULT;
  $("home").innerHTML =
    '<header><h1>Tiếng Việt</h1><div class="sub">Lesson ' + L.n + ": " + esc(L.title) + "</div></header>" +
    '<div class="panel">' + main + "</div>" +
    '<div class="panel">' + wk + "</div>" +
    '<div class="grid">' +
    '<button class="btn tile" data-act="go" data-to="listen">Listen<small>current lesson, with pauses</small></button>' +
    '<button class="btn tile" data-act="go" data-to="library">Sentences<small>everything you have met</small></button>' +
    '<button class="btn tile" data-act="go" data-to="lessons">Lessons<small>introductions and notes</small></button>' +
    '<button class="btn tile" data-act="go" data-to="checkin">Check-in<small>' + (ci ? "done this week" : dow(real) >= 4 ? "due now" : "on Fridays") + "</small></button>" +
    "</div>" +
    '<div class="panel minutes"><span>Minutes a day</span><span class="seg">' + MINUTES.map(m => '<button class="btn' + (m === mins ? " on" : "") + '" data-act="mins" data-m="' + m + '">' + m + "</button>").join("") + "</span></div>" +
    '<footer><span id="sync">' + syncText() + "</span><span>v " + APP_BUILD + "</span></footer>";
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "mins") { S.cfg = Object.assign({}, S.cfg, {min: +b.dataset.m}); S.cfgTs = Date.now(); save(); renderHome(); }   // takes effect with the next round that is built

// ----- the round -----
let cs = null;   // card state: {plays, revealed, shownAt, notes}
function startRound() {
  const t = today();
  settleOldRound(t);
  if (!S.round || S.round.day !== t) { S.round = buildRound(S, D, t); save(); }
  else {   // a round built before 1 Oct 2026 may still hold sound drills: drop the ones not yet answered
    const R = S.round, keep = R.items.filter((x, i) => i < R.pos || !D.sent[x.id] || D.sent[x.id].kind !== "d");
    if (keep.length !== R.items.length) { R.items = keep; save(); }
  }
  if (roundDone(S.round)) { show(S.round.tandem ? "home" : "tandem"); return; }
  cs = null; show("card");
}
const MODE_LABEL = {new: "New sentence", echo: "Listen and repeat", drill: "Sound drill", recall: "Say it from the meaning"};
function renderCard() {
  const R = S.round, it = R.items[R.pos], item = D.sent[it.id];
  if (!cs || cs.id !== it.id + ":" + R.pos) cs = {id: it.id + ":" + R.pos, plays: 0, revealed: it.m !== "recall", shownAt: Date.now(), readyAt: Date.now() + 350, notes: it.m === "new"};
  const ready = cs.revealed;   // Mike 2026-10-01: rating never waits for a play
  const pct = Math.round(100 * R.pos / R.items.length);
  let body = "";
  if (!cs.revealed) {
    body = '<div class="meaning big">' + esc(item.en) + '</div><div class="zh big">' + esc(item.zh) + "</div>" +
      '<p class="hint">Say it in Vietnamese, out loud. Then check.</p>' +
      '<button class="btn primary big" data-act="reveal">Check</button>';
  } else {
    body = '<div class="vi">' + viHtml(item.vi) + "</div>" +
      (hasMarks(item.vi) ? '<p class="hint small">The voice is off on the dotted syllable. Tap it.</p>' : "") +
      '<div class="markinfo"></div>' +
      '<div class="meaning">' + esc(item.en) + '</div><div class="zh">' + esc(item.zh) + "</div>" +
      ((item.note || item.hz) ? (cs.notes ? '<div class="notes">' + noteHtml(item) + "</div>" : '<button class="link" data-act="notes">Notes</button>') : "") +
      '<div class="plays">' +
      '<button class="btn play big" data-play="' + it.id + '" data-act="cplay">' + ICON.play + "<span>Play</span></button>" +
      '<button class="btn play" data-act="cplay" data-slow="1">' + ICON.play + "<span>Slow</span></button></div>" +
      (it.m === "new" ? '<p class="hint small">Play it, say it, play it again. Then rate yourself.</p>' : "") +
      '<div class="rate"><button class="btn again" data-act="rate" data-r="again"' + (ready ? "" : " disabled") + ">Again</button>" +
      '<button class="btn ok" data-act="rate" data-r="ok"' + (ready ? "" : " disabled") + ">Got it</button></div>";
  }
  $("card").innerHTML =
    '<div class="top"><button class="icon" data-act="go" data-to="home" aria-label="Back">' + ICON.back + '</button><div class="bar"><i style="width:' + pct + '%"></i></div><span class="count">' + (R.pos + 1) + "/" + R.items.length + "</span></div>" +
    '<div class="card"><div class="kicker">' + MODE_LABEL[it.m] + (it.retry ? ", once more" : "") + "</div>" + body + "</div>";
  const nxt = R.items[R.pos + 1]; if (nxt) preload(nxt.id);
}
function cardPlay(slow) {
  const it = S.round.items[S.round.pos];
  play(it.id, slow, () => { if (cur === "card" && cs) { cs.plays++; renderCard(); } });
}
function rate(r) {
  const R = S.round, it = R && R.items[R.pos];
  if (!cs || !it || cs.id !== it.id + ":" + R.pos) { if (it) renderCard(); else show("home"); return; }   // the state changed under the card
  if (Date.now() < cs.readyAt) return;   // a double tap must not rate the next card unseen
  if (R.day !== today()) { show("home"); return; }   // the card stayed open past midnight: today gets its own round
  const ms = Date.now() - cs.shownAt;
  answer(S, D, R, r, today(), ms); cs = null; stopAudio(); save();
  if (roundDone(R)) show("tandem"); else renderCard();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || cur !== "card") return;
  const a = b.dataset.act;
  if (a === "cplay") { e.stopImmediatePropagation(); cardPlay(b.dataset.slow === "1"); }
  if (a === "reveal") { cs.revealed = true; cs.notes = false; cardPlay(false); renderCard(); }
  if (a === "notes") { cs.notes = true; renderCard(); }
  if (a === "rate" && !b.disabled) rate(b.dataset.r);
}, true);
document.addEventListener("keydown", e => {   // on the Mac: space play, s slow, enter check, 1 again, 2 got it
  if (cur !== "card" || e.repeat || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  const q = s => document.querySelector("#card " + s);
  if (e.key === " ") { e.preventDefault(); if (cs && cs.revealed) cardPlay(false); }
  else if (e.key === "s") { if (cs && cs.revealed) cardPlay(true); }
  else if (e.key === "Enter") { const b = q('[data-act="reveal"]'); if (b) b.click(); }
  else if (e.key === "1") { const b = q('[data-r="again"]'); if (b && !b.disabled) rate("again"); }
  else if (e.key === "2") { const b = q('[data-r="ok"]'); if (b && !b.disabled) rate("ok"); }
});

// ----- listen: the current lesson in a row, started and stopped by hand -----
let LS = {on: false, i: 0, slow: false, echo: true, timer: 0, list: []};
function listenList() {
  const L = currentLesson(S, D);
  let ids = practised(D, L).filter(id => S.cards[id] && S.cards[id].box);
  if (!ids.length) { const prev = D.lessons[D.lessons.indexOf(L) - 1]; if (prev) ids = practised(D, prev).filter(id => S.cards[id]); }
  return ids;
}
function renderListen() {
  LS.list = listenList(); if (LS.i >= LS.list.length) LS.i = 0;
  const id = LS.list[LS.i], item = id && D.sent[id];
  $("listen").innerHTML = '<div class="top"><button class="icon" data-act="go" data-to="home" aria-label="Back">' + ICON.back + "</button></div>" +
    '<header><h1>Listen</h1><div class="sub">' + LS.list.length + " sentences you have met in this lesson. Each one plays, then a pause to say it" + (LS.echo ? ", then once more." : ".") + "</div></header>" +
    '<div class="card">' + (item ? '<div class="kicker">' + (LS.i + 1) + " of " + LS.list.length + '</div><div class="vi">' + viHtml(item.vi) + '</div><div class="markinfo"></div><div class="meaning">' + esc(item.en) + "</div>" : "<p>Nothing to play yet.</p>") + "</div>" +
    '<div class="plays"><button class="btn primary big" data-act="lstart">' + (LS.on ? ICON.stop + "<span>Stop</span>" : ICON.play + "<span>" + (LS.i ? "Go on" : "Start") + "</span>") + "</button></div>" +
    '<div class="toggles"><label><input type="checkbox" id="l_slow"' + (LS.slow ? " checked" : "") + "> slow</label>" +
    '<label><input type="checkbox" id="l_echo"' + (LS.echo ? " checked" : "") + "> play twice</label>" +
    (LS.i ? '<button class="link" data-act="lreset">from the start</button>' : "") + "</div>";
}
function stopListen() { LS.on = false; clearTimeout(LS.timer); if (cur === "listen") stopAudio(); }
function listenStep(second) {
  if (!LS.on) return;
  const id = LS.list[LS.i]; if (!id) { stopListen(); LS.i = 0; renderListen(); return; }
  renderListen();
  play(id, LS.slow, () => {
    const gap = Math.max(1500, (A.duration || 2) * 1000 * (LS.slow ? 1.6 : 1.2) + 1000);
    LS.timer = setTimeout(() => {
      if (!LS.on) return;
      if (LS.echo && !second) listenStep(true);
      else { LS.i++; if (LS.i >= LS.list.length) { LS.on = false; LS.i = 0; renderListen(); } else listenStep(false); }
    }, gap);
  });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || cur !== "listen") return;
  if (b.dataset.act === "lstart") { if (LS.on) { stopListen(); renderListen(); } else { LS.on = true; listenStep(false); } }
  if (b.dataset.act === "lreset") { stopListen(); LS.i = 0; renderListen(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "l_slow") LS.slow = e.target.checked;
  if (e.target.id === "l_echo") { LS.echo = e.target.checked; if (!LS.on) renderListen(); }
});

  document.querySelectorAll("#page .pl").forEach(b => { const id = b.dataset.id; b.outerHTML = playBtn(id, viHtml(D.sent[id] ? D.sent[id].vi : id)); });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "pg") show("page", {key: b.dataset.k, i: +b.dataset.i});
  if (b.dataset.act === "pgdone") { S.introRead = S.introRead || {}; S.introRead[b.dataset.k] = true; save(); show("home"); }
});

// ================= start =================
// A device without any local state starts only after the cloud has answered: a failed request must never create
// a second, fresh course that could later be taken for real progress.
function boot() {
  checkVersion();
  if (!SYNC_URL || Object.keys(S.cards).length) {
    if (!Object.keys(S.cards).length) { migrateLesson1(S, D, today()); save(); }
    show("home"); cloudSync(); return;
  }
  $("home").innerHTML = '<header><h1>Tiếng Việt</h1></header><div class="panel"><p>Loading your progress …</p></div>';
  cloudGet().then(o => {
    if (o && o.cards) { adopt(o); setSync(true); show("home"); }
    else { migrateLesson1(S, D, today()); save(); show("home"); }
  }).catch(() => {
    setSync(false);
    $("home").innerHTML = '<header><h1>Tiếng Việt</h1></header><div class="panel"><p>Could not reach the server, so your progress could not be loaded.</p>' +
      '<button class="btn primary big" data-act="retry">Try again</button></div>';
  });
}
document.addEventListener("click", e => { if (e.target.closest('[data-act="retry"]')) boot(); });
boot();

</script>
