"><\/span><div class=\"wlz\">喔（較親切）<\/div><div class=\"wle\">warm softening particle<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0117\" data-id=\"s0117\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>mai<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">明天<\/div><div class=\"wle\">tomorrow<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0118\" data-id=\"s0118\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>tiếp<\/b> <span class=\"wlh\">接<\/span><div class=\"wlz\">繼續<\/div><div class=\"wle\">continue<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0118\" data-id=\"s0118\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>hẹn gặp lại<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">再見<\/div><div class=\"wle\">see you again<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0119\" data-id=\"s0119\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><\/div>"}],"tandem":"<p>If you have not done it yet: send the seven persona sentences to one tandem as one message, with Em ở Sài Gòn hả? at the end, and ask them to correct anything. Paste their answer into Friday's check-in.<\/p>\n<p>Otherwise, one or two short messages with what you have:<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0001\"><\/div><div class=\"pl\" data-id=\"s0006\"><\/div><div class=\"pl\" data-id=\"s0112\"><\/div><div class=\"pl\" data-id=\"s0113\"><\/div><div class=\"pl\" data-id=\"s0118\"><\/div><div class=\"pl\" data-id=\"s0117\"><\/div><\/div>","startDay":{"s0001":1,"s0002":1,"s0003":1,"s0004":1,"s0005":1,"s0006":1,"s0007":1,"s0008":1,"s0009":1,"s0010":1,"s0120":1,"s0121":1,"s0011":1,"s0012":1,"s0013":1,"s0014":1,"s0015":1,"s0016":1,"s0017":1,"s0018":1,"s0019":1,"s0020":2,"s0021":2,"s0022":2,"s0023":2,"s0024":2,"s0025":2,"s0026":2,"s0027":2,"s0028":2,"s0029":2,"s0030":2,"s0031":2,"s0032":2,"s0033":2,"s0034":2,"s0035":2,"s0036":2,"s0037":2,"s0038":2,"s0039":2,"s0040":2,"s0041":2,"s0042":2,"s0043":3,"s0044":3,"s0045":3,"s0046":3,"s0047":3,"s0048":3,"s0049":3,"s0050":3,"s0051":3,"s0052":3,"s0053":3,"s0054":3,"s0055":3,"s0056":3,"s0057":3,"s0058":3,"s0059":3,"s0060":3,"s0061":3,"s0062":3,"s0063":3,"s0064":3,"s0065":3,"s0066":3,"s0067":3,"s0068":3,"s0069":3,"s0070":3,"s0071":3,"s0072":3,"s0073":3,"s0074":3,"s0075":3,"s0076":4,"s0077":4,"s0078":4,"s0079":4,"s0080":4,"s0081":4,"s0082":4,"s0083":4,"s0084":4,"s0085":4,"s0086":4,"s0087":4,"s0088":4,"s0089":4,"s0090":4,"s0091":4,"s0092":4,"s0093":4,"s0094":4,"s0095":4,"s0096":4,"s0097":5,"s0098":5,"s0099":5,"s0100":5,"s0101":5,"s0102":5,"s0103":5,"s0104":5,"s0105":5,"s0106":5,"s0107":5,"s0108":5,"s0109":5,"s0110":5,"s0111":5,"s0112":5,"s0113":5,"s0114":5,"s0115":5,"s0116":5,"s0117":5,"s0118":5,"s0119":5}},{"key":"l02","n":2,"title":"Particles, asking back, chatting","ids":["s0122","s0123","s0124","s0125","s0126","s0127","s0128","s0129","s0130","s0131","s0132","s0133","s0134","s0135","s0136","s0137","s0138","s0139","s0140","s0141","s0142","s0143","s0144","s0145","s0146","s0147","s0148","s0149","s0150","s0151","s0152","s0153"],"drills":[],"pages":[{"t":"The little words at the end","h":"<p>Saigon speech lives on short words at the end of a sentence. They carry no content, only tone of voice, and they are what makes a sentence sound like a person instead of a textbook. Your Mandarin has the same idea: 吧、喔、耶、嗎.<\/p>\n<div class=\"tw\"><table><tr><th>particle<\/th><th>what it does<\/th><th>close to<\/th><\/tr><tr><td>nha<\/td><td>softens a request or a plan<\/td><td>喔、吧<\/td><\/tr><tr><td>á<\/td><td>you know, I'm telling you<\/td><td>喔、耶<\/td><\/tr><tr><td>ha<\/td><td>asks the other person to agree<\/td><td>對吧、耶<\/td><\/tr><tr><td>luôn<\/td><td>totally; after a negative: at all<\/td><td>超、完全<\/td><\/tr><tr><td>nè<\/td><td>here, look: when you hand or send something<\/td><td>給你、你看<\/td><\/tr><tr><td>vậy<\/td><td>so, like that; softens a question (sao vậy?)<\/td><td>呢、那樣<\/td><\/tr><tr><td>đi<\/td><td>go ahead: turns a sentence into an invitation<\/td><td>吧<\/td><\/tr><tr><td>hả<\/td><td>checks something you just heard<\/td><td>喔？、是喔<\/td><\/tr><tr><td>hông<\/td><td>the yes-or-no question<\/td><td>嗎<\/td><\/tr><tr><td>ủa<\/td><td>at the start: huh, surprise<\/td><td>咦<\/td><\/tr><\/table><\/div>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0131\"><\/div><div class=\"pl\" data-id=\"s0135\"><\/div><div class=\"pl\" data-id=\"s0133\"><\/div><div class=\"pl\" data-id=\"s0142\"><\/div><div class=\"pl\" data-id=\"s0136\"><\/div><\/div>\n<p>Say them short and soft. A stressed particle sounds annoyed.<\/p>\n<p>Hanoi uses other words for several of these (nhỉ for ha, này for nè, ơ for ủa, thế for vậy). You will read them; you say the Saigon ones.<\/p>"},{"t":"Asking back","h":"<p>The most useful sentences for a learner are the ones that keep a conversation going when you are lost. Tandems like being asked; it is the easiest way to get a correction.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0122\"><\/div><div class=\"pl\" data-id=\"s0123\"><\/div><div class=\"pl\" data-id=\"s0124\"><\/div><div class=\"pl\" data-id=\"s0126\"><\/div><div class=\"pl\" data-id=\"s0127\"><\/div><\/div>\n<p>Em nói vậy là sao? means: what do you mean? Said gently it is a real question; said sharply it sounds annoyed. Smile when you say it.<\/p>"},{"t":"Reacting in a chat","h":"<p>Half of a chat is reacting. These are the reactions you will see most, and now you can send them too.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0139\"><\/div><div class=\"pl\" data-id=\"s0140\"><\/div><div class=\"pl\" data-id=\"s0141\"><\/div><div class=\"pl\" data-id=\"s0128\"><\/div><div class=\"pl\" data-id=\"s0130\"><\/div><\/div>\n<p>Thiệt hông? really asks whether it is true; Thiệt hả? from lesson 1 mostly shows surprise. Trời, dữ vậy! is pure Saigon: wow, that much, seriously. Ờ ha means oh right, I forgot or I hadn't thought of that.<\/p>"},{"t":"Small helpers: sao, đi, đang, mới, giùm, luôn","h":"<h3>sao: how<\/h3>\n<p>After a verb, sao asks how: nói sao (怎麼說), viết sao (怎麼寫). At the start of a question it usually asks why; that comes in lesson 6. Like 怎麼, sao covers how, why and what's wrong: Ủa, sao vậy? is 咦，怎麼了？<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0124\"><\/div><div class=\"pl\" data-id=\"s0122\"><\/div><\/div>\n<h3>đi at the end: an invitation<\/h3>\n<p>đi at the end turns a sentence into an invitation, like 吧. Since đi also means go, it can come twice.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0136\"><\/div><div class=\"pl\" data-id=\"s0137\"><\/div><\/div>\n<h3>đang: in the middle of<\/h3>\n<p>đang before the verb is 在、正在: right now, or these days.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0147\"><\/div><\/div>\n<h3>mới: just, and only then<\/h3>\n<p>In lesson 1 mới meant just (剛). When something happens later than you expected, it means only then (才): 我現在才知道.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0103\"><\/div><div class=\"pl\" data-id=\"s0144\"><\/div><\/div>\n<h3>giùm: for me, please<\/h3>\n<p>verb + giùm + person: do it as a favour, like 幫我…. Southern; Hanoi says hộ.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0149\"><\/div><\/div>\n<h3>luôn: totally, at all<\/h3>\n<p>After lắm it makes it stronger (超); at the end of a negative sentence it means at all (完全).<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0133\"><\/div><div class=\"pl\" data-id=\"s0134\"><\/div><\/div>"},{"t":"hông and không","h":"<p>In Saigon, không is often said hông. The course keeps one simple rule for what you say:<\/p>\n<ul><li>At the end of a yes-or-no question: hông. Em rảnh hông? (Are you free? 你有空嗎？)<\/li><li>In short fixed replies and in nghe hông kịp, ăn hông nổi: hông.<\/li><li>In a full statement: không.<\/li><\/ul>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0146\"><\/div><div class=\"pl\" data-id=\"s0127\"><\/div><div class=\"pl\" data-id=\"s0096\"><\/div><div class=\"pl\" data-id=\"s0134\"><\/div><\/div>\n<p>The lesson 1 sentences keep their không; both are right, hông is simply more relaxed.<\/p>\n<p>In chats you will see the short forms. You only need to read them: k or ko = không, and for hông also hong, hok, hem; dc or đc = được, r = rồi, j = gì, ms = mới, ntn = như thế nào. Write your own messages in full words for now; your tandems will read you better.<\/p>"},{"t":"Typing Vietnamese with Telex","h":"<p>Telex lets you type every Vietnamese letter on a normal keyboard. You type the base letters, and a few letter keys add the marks.<\/p>\n<p>On the Mac: System Settings, Keyboard, Text Input, Edit, then the plus button, Vietnamese, and choose Telex (not Simple Telex, which does not turn a lone w into ư). Switch between keyboards with the globe key, or Control and Space on older keyboards.<\/p>\n<p>On the iPhone: Settings, General, Keyboard, Keyboards, Add New Keyboard, Vietnamese, and pick Telex if it asks. Switch with the globe key on the keyboard.<\/p>\n<div class=\"tw\"><table><tr><th>you type<\/th><th>you get<\/th><\/tr><tr><td>aa, ee, oo<\/td><td>â, ê, ô<\/td><\/tr><tr><td>aw, ow, uw (or w)<\/td><td>ă, ơ, ư<\/td><\/tr><tr><td>dd<\/td><td>đ<\/td><\/tr><tr><td>s, f, r, x, j after the word<\/td><td>sắc, huyền, hỏi, ngã, nặng<\/td><\/tr><tr><td>z after the word<\/td><td>removes the tone mark<\/td><\/tr><\/table><\/div>\n<p>Examples: Vieetj gives Việt, nghiax gives nghĩa, khoer gives khỏe, dduwowcj gives được. Put the tone key at the end of the word; Telex places the mark on the right vowel by itself.<\/p>\n<p>Two things to know. Telex may write khoẻ where the course writes khỏe: both are correct, only the place of the mark differs. And s, r and x are letters at the start of a word and tone keys after the vowel: rồi is typed rooif, xin is xin.<\/p>\n<p>Practise in your chats: write one message a day with Telex instead of copying.<\/p>"},{"t":"Words in this lesson","h":"<p>32 words, in the order you meet them. The button plays the sentence where each one first comes up.<\/p><div class=\"wls\"><div class=\"wl\"><div class=\"wlt\"><b>ơi<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">欸（叫人）<\/div><div class=\"wle\">calling particle (em ơi)<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0122\" data-id=\"s0122\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>sao<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">怎麼；為什麼<\/div><div class=\"wle\">how; why<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0122\" data-id=\"s0122\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>chữ<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">字<\/div><div class=\"wle\">word, letter<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0123\" data-id=\"s0123\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>nghĩa<\/b> <span class=\"wlh\">義<\/span><div class=\"wlz\">意思<\/div><div class=\"wle\">meaning<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0123\" data-id=\"s0123\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>viết<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">寫<\/div><div class=\"wle\">write<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0124\" data-id=\"s0124\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>hông<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">不；（句尾）嗎（南部）<\/div><div class=\"wle\">not; question particle (Southern for không)<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0126\" data-id=\"s0126\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>kịp<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">來得及、跟上<\/div><div class=\"wle\">in time, keep up<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0127\" data-id=\"s0127\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>ủa<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">咦<\/div><div class=\"wle\">huh (surprise)<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0128\" data-id=\"s0128\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>ha<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">對吧、耶<\/div><div class=\"wle\">isn&#x27;t it? (asking for agreement)<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0131\" data-id=\"s0131\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>giỏi<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">厲害、很會<\/div><div class=\"wle\">good at, skilled<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0132\" data-id=\"s0132\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>luôn<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">超、完全<\/div><div class=\"wle\">totally; at all<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0133\" data-id=\"s0133\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>á<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">喔、耶（句尾）<\/div><div class=\"wle\">you know (at the end)<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0135\" data-id=\"s0135\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>đi<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">吧（句尾）<\/div><div class=\"wle\">go ahead (softening a request, at the end)<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0136\" data-id=\"s0136\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>dữ<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">厲害、誇張（南部）<\/div><div class=\"wle\">intense; wow (Southern)<\/div><\/div><button class=\"btn play mini\" data-act=\"play const CORE = (function () {
// core.js: the learning logic, no DOM. Used by the app (build.py inlines it) and by app/tests.
// Scheduling is ported from the kids' app (~/Documents/quizzes/src/engine.js): boxes 1 to 9, own interval
// and ease per card, a forgotten sure card falls back two boxes, problem cards stay in box 2.
// Differences: every day is a practice day (Mike, 1 Oct 2026), the round is limited by time, not by card count,
// and the grade comes from two buttons (Again / Got it), because the app cannot hear you.

const INTERVAL = {1: 1, 2: 2, 3: 4, 4: 8, 5: 15, 6: 30, 7: 60, 8: 120, 9: 240};   // in days
const MAX_BOX = 9, SURE_BOX = 4, RECALL_BOX = 3, DRILL_DONE_BOX = 4;
const LEECH_MISS = 5, LEECH_OK = 3;
const MINUTES = [10, 15, 20, 30], MIN_DEFAULT = 15;   // Mike 2026-10-01: every day, 15 minutes, changeable on the home screen
const NEW_MAX = 6;                     // never more new sentences in one day, however much time is left
const NEW_SHARE = 0.4;                 // new sentences take at most 40 % of the time, so the reviews they cause later still fit
const budgetMs = S => ((S.cfg && S.cfg.min) || MIN_DEFAULT) * 60000;
const REQUEUE_GAP = 4;
const MAX_RETRIES = 2;                 // at most two more tries of one card in a round
const MS_CAP = 120000;                 // time counted per card at most                 // "Again" brings the card back four cards later
const EST0 = {new: 75000, echo: 25000, recall: 25000, drill: 20000};

// ----- days -----
function dayOf(ms) { const d = new Date(ms); return Math.floor((ms - d.getTimezoneOffset() * 60000) / 86400000); }
const dow = d => ((d + 3) % 7 + 7) % 7;                       // 0 = Monday ... 6 = Sunday
// Every day counts (Mike, 1 Oct 2026). The names stay from the time of five practice days a week.
const practiceDay = d => d;
const addPractice = (d, n) => d + n;
const practiceBetween = (a, b) => Math.max(0, b - a);
const monday = d => d - dow(d);
function isoDate(d) { return new Date(d * 86400000).toISOString().slice(0, 10); }

// ----- cards -----
function isLeech(c) { return !!c && (c.miss || 0) >= LEECH_MISS && (c.ok || 0) < LEECH_OK; }
function planCard(c, t, easy) {
  c.ease = c.ease || 2.5;
  const prev = c.iv || INTERVAL[Math.max(1, (c.box || 1) - 1)] || 1;
  const elapsed = c.last != null ? practiceBetween(c.last, t) : prev;
  let iv;
  if ((c.box || 0) <= 3) iv = INTERVAL[c.box] || 1;                       // learning phase: 1, 2, 4 days
  else iv = Math.max(Math.max(prev, (prev + elapsed) / 2) * c.ease * (easy ? 1.3 : 1), prev + 1);   // Easy: 30 % further, as "easy" in the kids' engine
  iv = Math.min(365, Math.max(1, Math.round(iv)));
  if (iv >= 4 && c.box > 3) { const f = Math.max(1, Math.round(iv * 0.05)); iv = Math.min(365, iv + Math.floor(Math.random() * (2 * f + 1)) - f); }   // spread a little, no clumps

}
function lapseCard(c, t) { c.ease = Math.max(1.3, (c.ease || 2.5) - 0.2); c.iv = Math.max(1, Math.round((c.iv || 1) * 0.3)); c.last = t; c.due = addPractice(t, 1); }
function newCard(t) { return {box: 0, ease: 2.5, miss: 0, ok: 0, n: 0, ag: 0, born: t, due: t}; }   // due: an interrupted first meeting comes back

// What the card asks for. Drills are only ever repeated after the voice; sentences from box 3 on are said from the meaning.
function modeOf(item, c) {
  if (!c || !c.box) return "new";
  if (item.kind === "d") return "drill";
  return c.box >= RECALL_BOX ? "recall" : "echo";
}

// ----- lessons -----
// Sound drills (kind "d") are never practised (Mike, 1 Oct 2026: no more sound drills). They stay in the data
// for the play buttons on the lesson pages and in the sentence list.
const practised = (D, L) => L.ids.filter(id => D.sent[id] && D.sent[id].kind !== "d");
// The current lesson is the first one that still has sentences you have not met.
function currentLesson(S, D) {
  for (const L of D.lessons) if (practised(D, L).some(id => !S.cards[id])) return L;
  return D.lessons[D.lessons.length - 1];
}
function nextNew(S, D) { return practised(D, currentLesson(S, D)).filter(id => !S.cards[id]); }

// ----- the daily round -----
function estOf(S, m) { return (S.avg && S.avg[m]) || EST0[m]; }
// A card costs its own time plus, with the share of first answers that were Again, one more listen-and-repeat.
function costOf(S, m) { return estOf(S, m) + (S.ar == null ? 0.12 : S.ar) * estOf(S, "echo"); }
function buildRound(S, D, T) {
  const items = [], BUDGET = budgetMs(S); let est = 0, backlog = 0;
  const due = Object.keys(S.cards).filter(id => D.sent[id] && D.sent[id].kind !== "d" && !S.cards[id].ret && S.cards[id].due <= T)
    .sort((a, b) => (S.cards[a].box > 2) - (S.cards[b].box > 2) || S.cards[a].due - S.cards[b].due || S.cards[a].box - S.cards[b].box || (a < b ? -1 : 1));   // cards still being learned first, then the oldest
  for (const id of due) {
    const m = modeOf(D.sent[id], S.cards[id]), e = costOf(S, m);
    if (est + e <= BUDGET) { items.push({id, m}); est += e; } else backlog++;
  }
  let fresh = 0;
  const L = currentLesson(S, D);
  if (!backlog && (S.introRead || {})[L.key]) {      // new sentences only when the reviews fit and the lesson intro has been read
    const room = Math.min(BUDGET - est, BUDGET * NEW_SHARE);   // as many as fit
    let used = 0;
    for (const id of nextNew(S, D)) {
      if (fresh >= NEW_MAX) break;
      const e = costOf(S, "new"); if (used + e > room) break;
      used += e;
      items.push({id, m: "new"}); est += e; fresh++;
    }
  }
  return {day: T, lesson: L.key, items, pos: 0, est, backlog, ms: 0, tandem: null};
}
function roundDone(R) { return !!R && R.pos >= R.items.length; }

// rating: "ok" or "again". ms: time on the card.
function answer(S, D, R, rating, T, ms) {
  const it = R.items[R.pos], id = it.id, item = D.sent[id];
  let c = S.cards[id]; if (!c) c = S.cards[id] = newCard(T);
  const log = dayLog(S, T);
  ms = Math.min(Math.max(0, ms || 0), MS_CAP);   // a phone left lying on a card must not count as an hour of practice
  // a card counts once a day: if the other device already rated it today (rounds built separately, then merged),
  // a second answer neither promotes it again nor lapses it again
  const retry = it.retry || c.rv === T;
  if (!retry) c.rv = T;
  if (!retry) {
    if (ms > 0) { S.avg = S.avg || {}; const old = estOf(S, it.m); S.avg[it.m] = Math.round(0.85 * old + 0.15 * Math.max(4000, ms)); }
    if (it.m === "new" && !c.n) log.fresh++;
    c.n = (c.n || 0) + 1; log.n++;
    S.ar = Math.round(1000 * (0.95 * (S.ar == null ? 0.12 : S.ar) + 0.05 * (rating === "again" ? 1 : 0))) / 1000;   // running share of Again
  }
  if (ms > 0) { R.ms += ms; log.ms += ms; }
  if (rating === "ok" || rating === "easy") {
    // Easy (Mike, 2 Oct 2026): a sentence so easy that reviewing it wastes time. A new one skips a step (back in 2 days),
    // one in the learning phase jumps two boxes, a sure one goes 30 % further and counts as easier from now on.
    // On a retry or a problem card Easy counts as Got it.
    const easy = rating === "easy" && !retry && !isLeech(c);
    if (!c.box) { c.box = easy ? 2 : 1; c.iv = INTERVAL[c.box]; c.last = T; c.due = addPractice(T, c.iv); }
    else if (!retry) {
      const wasLeech = isLeech(c);   // a problem card stays in box 2 until it sits three times in a row (as in the kids' engine)
      c.box = Math.min(c.box + (easy && c.box < 3 ? 2 : 1), wasLeech ? 2 : MAX_BOX); c.ok = (c.ok || 0) + 1;
      if (!wasLeech) c.miss = Math.max(0, (c.miss || 0) - 1);
      if (easy && c.box > 3) c.ease = Math.min(3, (c.ease || 2.5) + 0.15);
      else if (c.box > 4) c.ease = Math.min(2.5, (c.ease || 2.5) + 0.05);   // without Easy, ease could only fall; let it recover slowly
      planCard(c, T, easy && c.box > 3);
      if (item.kind === "d" && c.box >= DRILL_DONE_BOX) c.ret = 1;      // sound drills run out
    }
  } else {
    if (!retry) {
      c.ag = (c.ag || 0) + 1; log.ag.push(id);
      if (c.box) { c.box = (!isLeech(c) && c.box >= SURE_BOX) ? c.box - 2 : 1; c.ok = 0; c.miss = (c.miss || 0) + 1; lapseCard(c, T); }
    }
    const m = c.box ? (item.kind === "d" ? "drill" : "echo") : "new";       // the retry is always listen and repeat
    const tries = R.items.filter(x => x.id === id && x.retry).length;
    if (tries < MAX_RETRIES) R.items.splice(Math.min(R.pos + 1 + REQUEUE_GAP, R.items.length), 0, {id, m, retry: true});   // then it waits for tomorrow
  }
  R.pos++;
}
// Undo of the last rating (Mike, 2 Oct 2026): a snapshot of everything answer() can change, taken just before it.
function undoPoint(S, R, T) {
  const it = R.items[R.pos], days = S.days || {};
  return JSON.parse(JSON.stringify({id: it.id, card: S.cards[it.id] || null, round: R, T, day: days[T] || null, ar: S.ar == null ? null : S.ar, avg: S.avg || {}}));
}
function applyUndo(S, u) {
  if (u.card) S.cards[u.id] = u.card; else delete S.cards[u.id];
  S.round = u.round; S.days = S.days || {};
  if (u.day) S.days[u.T] = u.day; else delete S.days[u.T];
  if (u.ar == null) delete S.ar; else S.ar = u.ar;
  S.avg = u.avg;
}
// Free practice (not the daily round): Again makes a card due tomorrow at the latest, nothing else changes.
function practiceAgain(S, id, T) {
  const c = S.cards[id]; if (!c || !c.box) return false;
  if (c.due > T + 1) { c.due = T + 1; return true; }
  return false;
}
function dayLog(S, T) {
  S.days = S.days || {};
  const g = S.days[T] = S.days[T] || {n: 0, fresh: 0, ms: 0, ag: [], done: false};
  if (!g.ag) g.ag = [];
  return g;

// ----- the round -----
let cs = null;   // card state: {plays, revealed, shownAt, notes}
function startRound() {
  const t = today();
  settleOldRound(t);
  if (!S.round || S.round.day !== t) { S.round = buildRound(S, D, t); UNDO = null; save(); }
  else {   // a round built before 1 Oct 2026 may still hold sound drills: drop the ones not yet answered
    const R = S.round, keep = R.items.filter((x, i) => i < R.pos || !D.sent[x.id] || D.sent[x.id].kind !== "d");
    if (keep.length !== R.items.length) { R.items = keep; save(); }
  }
  if (roundDone(S.round)) { show(S.round.tandem ? "home" : "tandem"); return; }
  cs = null; show("card");
}
const MODE_LABEL = {new: "New sentence", echo: "Listen and repeat", drill: "Sound drill", recall: "Say it from the meaning"};
function renderCard() {
  const R = S.round, it = R.items[R.pos], item = D.sent[it.id];
  if (!cs || cs.id !== it.id + ":" + R.pos) cs = {id: it.id + ":" + R.pos, plays: 0, revealed: it.m !== "recall", shownAt: Date.now(), notes: it.m === "new"};
  const ready = cs.revealed;   // Mike 2026-10-01: rating never waits for a play
  const pct = Math.round(100 * R.pos / R.items.length);
  let body = "";
  if (!cs.revealed) {
    body = '<div class="meaning big">' + esc(item.en) + '</div><div class="zh big">' + esc(item.zh) + "</div>" +
      '<p class="hint">Say it in Vietnamese, out loud. Then check.</p>' +
      '<button class="btn primary big" data-act="reveal">Check</button>';
  } else {
    body = sentenceHtml(item) +
      ((item.note || item.hz || item.x) ? (cs.notes ? '<div class="notes">' + noteHtml(item) + "</div>" : '<button class="link" data-act="notes">Notes</button>') : "") +
      '<div class="plays">' +
      '<button class="btn play big" data-play="' + it.id + '" data-act="cplay">' + ICON.play + "<span>Play</span></button>" +
      '<button class="btn play" data-play="' + it.id + '" data-act="cplay" data-slow="1">' + ICON.play + "<span>Slow</span></button></div>" +
      (it.m === "new" ? '<p class="hint small">Play it, say it, play it again. Then rate yourself.</p>' : "") +
      '<div class="rate"><button class="btn again" data-act="rate" data-r="again"' + (ready ? "" : " disabled") + ">Again</button>" +
      '<button class="btn ok" data-act="rate" data-r="ok"' + (ready ? "" : " disabled") + ">Got it</button>" +
      '<button class="btn easy" data-act="rate" data-r="easy"' + (ready ? "" : " disabled") + ">Easy</button></div>";
  }
  $("card").innerHTML =
    '<div class="top"><button class="icon" data-act="go" data-to="home" aria-label="Back">' + ICON.back + '</button><div class="bar"><i style="width:' + pct + '%"></i></div><span class="count">' + (R.pos + 1) + "/" + R.items.length + "</span>" + undoLink() + "</div>" +
    '<div class="card"><div class="kicker">' + MODE_LABEL[it.m] + (it.retry ? ", once more" : "") + "</div>" + body + "</div>";
  const nxt = R.items[R.pos + 1]; if (nxt) preload(nxt.id);
}
function cardPlay(slow) {
  const it = S.round.items[S.round.pos];
  play(it.id, slow, () => { if (cs) cs.plays++; });   // no redraw: an open explanation of a dotted syllable stays open
}
// Undo: one step back, the last rating of the round (Mike, 2 Oct 2026). Gone when the cloud replaces the state.
let UNDO = null;
const undoLink = () => UNDO ? '<button class="link undo" data-act="undo">Undo</button>' : "";
function undoLast() {
  if (!UNDO) return;
  applyUndo(S, UNDO); UNDO = null; cs = null; stopAudio(); save();
  if (S.round && !roundDone(S.round) && S.round.day === today()) show("card"); else show("home");
}
document.addEventListener("click", e => { if (e.target.closest('[data-act="undo"]')) { e.stopImmediatePropagation(); undoLast(); } }, true);
function rate(r) {
  const R = S.round, it = R && R.items[R.pos];
  if (!cs || !it || cs.id !== it.id + ":" + R.pos) { if (it) renderCard(); else show("home"); return; }   // the state changed under the card
  if (R.day !== today()) { show("home"); return; }   // the card stayed open past midnight: today gets its own round
  const ms = Date.now() - cs.shownAt;
  UNDO = undoPoint(S, R, today());
  answer(S, D, R, r, today(), ms); cs = null; stopAudio(); save();
  if (roundDone(R)) show("tandem"); else renderCard();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || cur !== "card") return;
  const a = b.dataset.act;

  if (a === "reveal") { cs.revealed = true; cs.notes = false; cardPlay(false); renderCard(); }

}, true);
document.addEventListener("keydown", e => {   // on the Mac: space play, s slow, enter check, 1 again, 2 got it, 3 easy
  if (cur !== "card" || e.repeat || e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  const q = s => document.querySelector("#card " + s);
  if (e.key === " ") { e.preventDefault(); if (cs && cs.revealed) cardPlay(false); }
  else if (e.key === "s") { if (cs && cs.revealed) cardPlay(true); }
  else if (e.key === "Enter") { const b = q('[data-act="reveal"]'); if (b) b.click(); }
  else if (e.key === "1") { const b = q('[data-r="again"]'); if (b && !b.disabled) rate("again"); }
  else if (e.key === "2") { const b = q('[data-r="ok"]'); if (b && !b.disabled) rate("ok"); }
  else if (e.key === "3") { const b = q('[data-r="easy"]'); if (b && !b.disabled) rate("easy"); }
});

  if (!LS.on) return;

// A device without any local state starts only after the cloud has answered: a failed request must never create
// a second, fresh course that could later be taken for real progress.
function boot() {
  checkVersion();
  if (!SYNC_URL || Object.keys(S.cards).length) {
    if (!Object.keys(S.cards).length) { migrateLesson1(S, D, today()); save(); }
    show("home"); cloudSync(); return;
  }
  $("home").innerHTML = '<header><h1>Tiếng Việt</h1></header><div class="panel"><p>Loading your progress …</p></div>';
  cloudGet().then(o => {
    if (o && o.cards) { adopt(o); setSync(true); show("home"); }
    else { migrateLesson1(S, D, today()); save(); show("home"); }
  }).catch(() => {
    setSync(false);
    $("home").innerHTML = '<header><h1>Tiếng Việt</h1></header><div class="panel"><p>Could not reach the server, so your progress could not be loaded.</p>' +
      '<button class="btn primary big" data-act="retry">Try again</button></div>';
  });
}
document.addEventListener("click", e => { if (e.target.closest('[data-act="retry"]')) boot(); });
boot();

</script>
