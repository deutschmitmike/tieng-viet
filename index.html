ì.","note":"","hz":"","en":"You're welcome. / It's nothing.","zh":"不客氣。","kind":"s","g":[["Không","沒"],["có","有"],["gì.","什麼"]],"x":"Literally 沒有什麼: the usual answer to thanks."},"s0008":{"vi":"Anh tên là Mike.","note":"","hz":"","en":"My name is Mike.","zh":"我叫 Mike。","kind":"s","g":[["Anh","我"],["tên","名字"],["là","是"],["Mike.","Mike"]],"x":"Literally 我名字是 Mike: the topic first, then là. là links two nouns, like 是."},"s0009":{"vi":"Em tên gì?","note":"","hz":"","en":"What's your name?","zh":"你叫什麼名字？","kind":"s","g":[["Em","你"],["tên","名字"],["gì?","什麼"]],"x":"Question words stand where the answer goes: Em tên gì? Anh tên (là) Mike. The question needs no là."},"s0010":{"vi":"Rất vui được gặp em.","note":"rất: r curled back like the Mandarin 日, and the final t is said as c (rấc). The voice says z here, which is wrong 錄音的 r 不對，你要唸捲舌的「日」。","hz":"","en":"Nice to meet you.","zh":"很高興認識你。","kind":"s","g":[["Rất","很"],["vui","高興"],["được","能"],["gặp","見"],["em.","你"]],"x":"rất before an adjective = 很. được before a verb = get to (do): vui được gặp = glad to get to meet. A little textbook, fine in a first chat."},"s0120":{"vi":"Em ăn cơm chưa?","note":"ăn sounds like \"ăng\" in Saigon","hz":"","en":"Have you eaten yet? (a common way to greet)","zh":"你吃飯了沒？（常見的打招呼）","kind":"s","g":[["Em","你"],["ăn","吃"],["cơm","飯"],["chưa?","了嗎"]],"x":"chưa at the end asks whether something has happened yet, 了嗎. A friendly greeting, like 吃飽沒."},"s0121":{"vi":"Anh ăn rồi. Còn em?","note":"the answer to Anh ăn cơm chưa?: rồi = already, 了","hz":"","en":"Yes, I have (eaten). And you?","zh":"吃過了。你呢？","kind":"s","g":[["Anh","我"],["ăn","吃"],["rồi.","了"],["Còn","那"],["em?","你呢"]],"x":"rồi after the verb = already, 了. The answer to …chưa? is …rồi (yes) or chưa (not yet)."},"s0011":{"vi":"anh, em, ăn, đi, tên","note":"ngang tone: flat, mid, no movement (lower than a Mandarin 1st tone)","hz":"","en":"(ngang) older brother, you; younger sibling, you; eat; go; name","zh":"（ngang）哥哥、你；弟弟妹妹、你；吃；去；名字","kind":"d","g":[["anh,","哥哥、你"],["em,","弟弟妹妹、你"],["ăn,","吃"],["đi,","去"],["tên","名字"]]},"s0012":{"vi":"là, và, nhà, gì, người","note":"huyền tone: low, falling gently, relaxed voice","hz":"","en":"(huyền) to be; and; house; what; person","zh":"（huyền）是；和；家；什麼；人","kind":"d","g":[["là,","是"],["và,","和"],["nhà,","家"],["gì,","什麼"],["người","人"]]},"s0013":{"vi":"có, cá, nói, biết, sáng","note":"sắc tone: rising, like a Mandarin 2nd tone; on biết it is short and high","hz":"","en":"(sắc) have; fish; speak; know; morning, bright","zh":"（sắc）有；魚；說；知道；早上、亮","kind":"d","g":[["có,","有"],["cá,","魚"],["nói,","說"],["biết,","知道"],["sáng","早上、亮"]]},"s0014":{"vi":"khỏe, hỏi, ở, cũng, nữa","note":"hỏi and ngã are one tone in Saigon: dip then rise, like a full Mandarin 3rd tone, longer than the others","hz":"","en":"(hỏi / ngã) healthy; ask; be at, live; also; more, again","zh":"（hỏi／ngã）健康；問；在、住；也；再、更","kind":"d","g":[["khỏe,","健康"],["hỏi,","問"],["ở,","在、住"],["cũng,","也"],["nữa","再、更"]]},"s0015":{"vi":"mệt, học, một, được, chị","note":"nặng tone: low, falling, a slight rise at the end; on mệt, học, một, được it is short, cut off by the final consonant","hz":"","en":"(nặng) tired; study; one; can, get; older sister, you","zh":"（nặng）累；學；一；可以、得到；姊姊、你","kind":"d","g":[["mệt,","累"],["học,","學"],["một,","一"],["được,","可以、得到"],["chị","姊姊、你"]]},"s0016":{"vi":"ma, mà, má, mã, mạ","note":"one syllable, five Saigon tones: level, low falling, rising, dip-rise, low with a slight rise","hz":"魔 (ma) / 碼 (mã)","en":"ghost; but, that; mom (Saigon); code; rice seedling","zh":"鬼；但是、而；媽（南部）；代碼；秧苗","kind":"d","g":[["ma,","鬼"],["mà,","但是、而"],["má,","媽（南部）"],["mã,","代碼"],["mạ","秧苗"]]},"s0017":{"vi":"ba, bà, bả","note":"bả = bà ấy, she (colloquial Southern)","hz":"婆 (bà)","en":"three, dad (Saigon); grandmother, Mrs; she (colloquial)","zh":"三、爸（南部）；奶奶、太太；她（口語）","kind":"d","g":[["ba,","三、爸（南部）"],["bà,","奶奶、太太"],["bả","她（口語）"]]},"s0018":{"vi":"mua, mùa, múa","note":"","hz":"","en":"buy; season; dance","zh":"買；季節；跳舞","kind":"d","g":[["mua,","買"],["mùa,","季節"],["múa","跳舞"]]},"s0019":{"vi":"cơ, cờ, cớ, cỡ","note":"cỡ đó (about that much) is colloquial Southern","hz":"肌 (cơ)","en":"muscle; flag, chess; reason, pretext (cái cớ); size, roughly (cỡ đó)","zh":"肌肉；旗、棋；藉口；大小、大概","kind":"d","g":[["cơ,","肌肉"],["cờ,","旗、棋"],["cớ,","藉口"],["cỡ","大小、大概"]]},"s0020":{"vi":"mắt, mất, mát","note":"ă: short and clipped; â: short and central, like the e in German \"bitte\"; a: long and open","hz":"","en":"eye; lose; cool (weather)","zh":"眼睛；弄丟；涼爽","kind":"d","g":[["mắt,","眼睛"],["mất,","弄丟"],["mát","涼爽"]]},"s0021":{"vi":"tam, tăm, tâm","note":"","hz":"三 (tam) / 心 (tâm)","en":"three (Sino); toothpick; heart, mind (tâm lý)","zh":"三；牙籤；心","kind":"d","g":[["tam,","三"],["tăm,","牙籤"],["tâm","心"]]},"s0022":{"vi":"lan, lăn, lân","note":"in Saigon the final -n here sounds like -ng: lang, lăng, lâng","hz":"蘭 (lan) / 鄰 (lân)","en":"orchid, spread; roll; neighbouring (lân cận)","zh":"蘭花、擴散；滾；鄰近","kind":"d","g":[["lan,","蘭花、擴散"],["lăn,","滾"],["lân","鄰近"]]},"s0023":{"vi":"to, tô, tơ","note":"o: open, like German \"offen\"; ô: closed, like \"Ofen\"; ơ: unrounded, like the vowel in English \"bird\", long; â is its short partner","hz":"","en":"big; big bowl, e.g. for phở (a rice bowl is chén in Saigon, bát in Hanoi); silk","zh":"大；大碗（裝河粉的碗；飯碗南部說 chén）；絲","kind":"d"},"s0024":{"vi":"lo, lô, lơ","note":"","hz":"","en":"worry; lot, plot (lô đất); ignore (lơ đi)","zh":"擔心；地段；不理（lơ đi）","kind":"d","g":[["lo,","擔心"],["lô,","地段"],["lơ","不理（lơ đi）"]]},"s0025":{"vi":"mua, mưa","note":"ư: say u but spread the lips as for i","hz":"","en":"buy; rain","zh":"買；下雨","kind":"d","g":[["mua,","買"],["mưa","下雨"]]},"s0026":{"vi":"thu, thư","note":"","hz":"秋 (thu) / 書 (thư)","en":"autumn; letter","zh":"秋天；信","kind":"d","g":[["thu,","秋天"],["thư","信"]]},"s0027":{"vi":"tu, tư","note":"","hz":"修 (tu) / 私 (tư)","en":"practise (religion); private, personal (tư nhân); also four, fourth (thứ Tư, chú Tư)","zh":"修行；私（tư nhân 私人）；四（thứ Tư 星期三）","kind":"d"},"s0028":{"vi":"me, mê","note":"e: open, like German \"Bett\"; ê: closed, like \"Beet\"","hz":"迷 (mê)","en":"tamarind; crazy about","zh":"羅望子；迷、著迷","kind":"d","g":[["me,","羅望子"],["mê","迷、著迷"]]},"s0029":{"vi":"chè, chê","note":"","hz":"","en":"sweet soup; criticise, look down on","zh":"甜湯；嫌、批評","kind":"d","g":[["chè,","甜湯"],["chê","嫌、批評"]]},"s0030":{"vi":"bé, bế","note":"bé: in Saigon a little kid; small is nhỏ (Hanoi: bé). bế is Northern; Saigon says bồng or ẵm","hz":"","en":"small, little kid; carry (a child) in the arms","zh":"小、小孩；抱（小孩）","kind":"d","g":[["bé,","小、小孩"],["bế","抱（小孩）"]]},"s0031":{"vi":"bia, biết","note":"ia: i gliding into a lazy ơ; written iê before a final consonant, same sound","hz":"","en":"beer; know","zh":"啤酒；知道","kind":"d","g":[["bia,","啤酒"],["biết","知道"]]},"s0032":{"vi":"mua, muốn","note":"ua: u gliding into ơ; written uô before a final","hz":"","en":"buy; want","zh":"買；想要","kind":"d","g":[["mua,","買"],["muốn","想要"]]},"s0033":{"vi":"mưa, mượn","note":"ưa: ư gliding into ơ; written ươ before a final","hz":"","en":"rain; borrow","zh":"下雨；借","kind":"d","g":[["mưa,","下雨"],["mượn","借"]]},"s0034":{"vi":"chưa, được","note":"","hz":"","en":"not yet; can, get, okay","zh":"還沒；可以、得到","kind":"d","g":[["chưa,","還沒"],["được","可以、得到"]]},"s0035":{"vi":"Trời mát quá.","note":"quá: keep the k, kwá. In Saigon you will often hear wá in fast speech. Hanoi also says kwá 唸 kwá，不要唸成 wá。","hz":"","en":"The weather is so nice and cool.","zh":"天氣好涼爽。","kind":"s","g":[["Trời","天氣"],["mát","涼爽"],["quá.","好","過"]],"x":"trời = sky, here the weather. quá after an adjective = so, really: 好涼喔."},"s0036":{"vi":"Hôm nay trời mưa.","note":"","hz":"","en":"It's raining today.","zh":"今天下雨。","kind":"s","g":[["Hôm nay","今天"],["trời","天"],["mưa.","下雨"]],"x":"Time words come first. trời mưa = the sky rains, 下雨."},"s0037":{"vi":"Anh muốn mua cà phê.","note":"","hz":"","en":"I want to buy coffee.","zh":"我想買咖啡。","kind":"s","g":[["Anh","我"],["muốn","想"],["mua","買"],["cà phê.","咖啡"]],"x":"muốn + verb = want to, 想. The order is the Mandarin one: 我想買咖啡."},"s0038":{"vi":"Cho anh một ly cà phê sữa đá.","note":"ly = glass (Saigon; Hanoi: cốc); một ends with the lips closed, like \"mộc\"","hz":"","en":"One iced milk coffee, please. (literally: give me one glass of ...)","zh":"我要一杯冰的煉乳咖啡。","kind":"s","g":[["Cho","給"],["anh","我"],["một","一"],["ly","杯"],["cà phê","咖啡"],["sữa","煉乳"],["đá.","冰"]],"x":"Cho anh + thing = give me…, the standard way to order. ly is the classifier for a glass. What describes the noun follows it: cà phê sữa đá = coffee, (with) milk, (with) ice."},"s0039":{"vi":"Cho anh một tô phở.","note":"","hz":"","en":"A bowl of phở, please.","zh":"我要一碗河粉。","kind":"s","g":[["Cho","給"],["anh","我"],["một","一"],["tô","大碗"],["phở.","河粉"]],"x":"The same frame: number + classifier + noun, as in 一碗河粉."},"s0040":{"vi":"Em biết chưa?","note":"chưa at the end asks whether something has happened yet, like 了嗎","hz":"","en":"Do you know yet? / Have you heard?","zh":"你知道了嗎？","kind":"s","g":[["Em","你"],["biết","知道"],["chưa?","了嗎"]],"x":"chưa at the end: has it happened yet? Here: do you know yet, have you heard?"},"s0041":{"vi":"Chưa, anh chưa biết.","note":"","hz":"","en":"Not yet, I don't know yet.","zh":"還沒，我還不知道。","kind":"s","g":[["Chưa,","還沒"],["anh","我"],["chưa","還沒"],["biết.","知道"]],"x":"chưa before a verb = not yet, 還沒. The short answer simply repeats it."},"s0042":{"vi":"Anh mệt quá.","note":"","hz":"","en":"I'm so tired.","zh":"我好累。","kind":"s","g":[["Anh","我"],["mệt","累"],["quá.","好","過"]],"x":"Adjectives work like verbs, no 是 needed: anh mệt = I (am) tired."},"s0043":{"vi":"dạ, dài, dễ, gì, giờ, giá","note":"d and gi are both y (as in English yes) in Saigon","hz":"","en":"yes (polite); long; easy; what; hour, time; price","zh":"是、嗯；長；容易；什麼；點、時間；價格","kind":"d","g":[["dạ,","是、嗯"],["dài,","長"],["dễ,","容易"],["gì,","什麼"],["giờ,","點、時間"],["giá","價格"]]},"s0044":{"vi":"đi, đâu, đó, được","note":"đ is a real d, tongue at the teeth, with a slight inward gulp (implosive); a plain d is fine","hz":"","en":"go; where; there, that; can","zh":"去；哪裡；那、那個；可以","kind":"d","g":[["đi,","去"],["đâu,","哪裡"],["đó,","那、那個"],["được","可以"]]},"s0045":{"vi":"dài, đài","note":"y versus d","hz":"臺 (đài)","en":"long; station, platform (đài truyền hình = TV station)","zh":"長；台（電台、電視台）","kind":"d","g":[["dài,","長"],["đài","台（電台、電視台）"]]},"s0046":{"vi":"dao, đào","note":"","hz":"桃 (đào)","en":"knife; peach, dig","zh":"刀；桃子、挖","kind":"d","g":[["dao,","刀"],["đào","桃子、挖"]]},"s0047":{"vi":"da, đa","note":"","hz":"多 (đa)","en":"skin; many (đa số = majority)","zh":"皮膚；多（đa số 多數）","kind":"d","g":[["da,","皮膚"],["đa","多（đa số 多數）"]]},"s0048":{"vi":"vui, về, vậy, và","note":"say v. In fast Saigon speech and in much of the Mekong Delta you will hear y (vui like yui). Hanoi says v","hz":"","en":"happy; return, go home; so, like that; and","zh":"開心；回；那樣；和","kind":"d","g":[["vui,","開心"],["về,","回"],["vậy,","那樣"],["và","和"]]},"s0049":{"vi":"rồi, ra, rất, rẻ, rửa","note":"Saigon r: tongue curled back, close to an English r, not the Hanoi z. the voice says z here and that is wrong: you say the Mandarin 日, tongue curled back 錄音的 r 不對，你要唸捲舌的 日","hz":"","en":"already; go out; very; cheap; wash","zh":"了、已經；出去；很；便宜；洗","kind":"d","g":[["rồi,","了、已經"],["ra,","出去"],["rất,","很"],["rẻ,","便宜"],["rửa","洗"]]},"s0050":{"vi":"ra, da, gia","note":"three spellings, two sounds in Saigon: ra with r, da and gia both with y. the voice says z here and that is wrong: you say the Mandarin 日, tongue curled back 錄音的 r 不對，你要唸捲舌的 日","hz":"家 (gia)","en":"go out; skin; family (gia đình)","zh":"出去；皮膚；家（gia đình 家庭）","kind":"d","g":[["ra,","出去"],["da,","皮膚"],["gia","家（gia đình 家庭）"]]},"s0051":{"vi":"trà, chà","note":"tr: tongue curled back. ch: tongue flat behind the teeth. Keeping them apart is the careful Saigon form; fast Saigon speech and Hanoi merge them. the voice merges tr and ch here and that is the fast Saigon form: you keep them apart 錄音把 tr 和 ch 混在一起了，你要分開唸","hz":"茶 (trà)","en":"tea; rub, scrub","zh":"茶；搓、擦","kind":"d","g":[["trà,","茶"],["chà","搓、擦"]]},"s0052":{"vi":"trưa, chưa","note":"same pair on another vowel. the voice merges tr and ch here and that is the fast Saigon form: you keep them apart 錄音把 tr 和 ch 混在一起了，你要分開唸","hz":"","en":"noon; not yet","zh":"中午；還沒","kind":"d","g":[["trưa,","中午"],["chưa","還沒"]]},"s0053":{"vi":"con trai, cái chai","note":"con trai = son, cái chai = the bottle. The whole meaning hangs on tr against ch. the voice merges tr and ch here and that is the fast Saigon form: you keep them apart 錄音把 tr 和 ch 混在一起了，你要分開唸","hz":"","en":"boy, son; bottle","zh":"男孩、兒子；瓶子","kind":"d","g":[["con trai,","男孩、兒子"],["cái chai","瓶子"]]},"s0054":{"vi":"sinh, xinh","note":"say them apart: s with the tongue curled back like Mandarin 是, x like a plain s. Both end like ưn (sưn, xưn), the vowel pulls back. Fast Saigon speech and Hanoi merge s and x. xinh itself is Northern-flavoured; in Saigon say đẹp or dễ thương. The voice merges s and x and misses the vowel trace: you keep them apart 錄音把 s 和 x 混在一起了，你要分開唸。","hz":"生 (sinh)","en":"be born; pretty","zh":"生；漂亮","kind":"d","g":[["sinh,","生"],["xinh","漂亮"]]},"s0055":{"vi":"xa, sa","note":"same pair, other order. the voice merges s and x here and that is the fast Saigon form: you keep them apart 錄音把 s 和 x 混在一起了，你要分開唸","hz":"沙 (sa)","en":"far; fall, sand (sa mạc = desert)","zh":"遠；落、沙（sa mạc 沙漠）","kind":"d","g":[["xa,","遠"],["sa","落、沙（sa mạc 沙漠）"]]},"s0056":{"vi":"tôi, thôi","note":"t = Mandarin d (no puff of air); th = Mandarin t (puff of air)","hz":"","en":"I (neutral); stop, enough, okay then","zh":"我（中性）；算了、好了","kind":"d","g":[["tôi,","我（中性）"],["thôi","算了、好了"]]},"s0057":{"vi":"tiền, thiền","note":"","hz":"錢 (tiền) / 禪 (thiền)","en":"money; zen, meditation","zh":"錢；禪","kind":"d","g":[["tiền,","錢"],["thiền","禪"]]},"s0058":{"vi":"tay, thay","note":"","hz":"","en":"hand, arm; replace, change","zh":"手；替換","kind":"d","g":[["tay,","手"],["thay","替換"]]},"s0059":{"vi":"cô, khô","note":"c = Mandarin g; kh = Mandarin k, aspirated (Hanoi adds friction, like the ch in German \"Bach\")","hz":"姑 (cô) / 枯 (khô)","en":"aunt, Ms; dry","zh":"姑姑、小姐；乾","kind":"d","g":[["cô,","姑姑、小姐"],["khô","乾"]]},"s0060":{"vi":"cá, khá","note":"","hz":"","en":"fish; fairly, quite","zh":"魚；相當、蠻","kind":"d","g":[["cá,","魚"],["khá","相當、蠻"]]},"s0061":{"vi":"quá, quê, quen, quán","note":"say kw: quá, quê, quen, quán, the k stays. That is the careful Saigon form; your tandem may well say wá, wê, wen, wán, which is everyday Saigon speech. Hanoi also says kw, so this is about care, not about dialect 唸 kw。西貢日常常說 wá，這是講究程度，不是南北差別。","hz":"過 (quá) / 館 (quán)","en":"too, very; hometown, countryside; be used to, know (someone); shop, café, eatery","zh":"太、非常；家鄉；熟悉、認識；店、館","kind":"d","g":[["quá,","太、非常"],["quê,","家鄉"],["quen,","熟悉、認識"],["quán","店、館"]]},"s0062":{"vi":"ngon, người, nghe, nghỉ","note":"ng at the start of a syllable: the sound at the end of \"sing\", then keep going","hz":"","en":"delicious; person; hear, listen; rest","zh":"好吃；人；聽；休息","kind":"d","g":[["ngon,","好吃"],["người,","人"],["nghe,","聽"],["nghỉ","休息"]]},"s0063":{"vi":"nhà, nhiều, nhớ, nhanh","note":"nh: Spanish ñ, the ny in \"canyon\"","hz":"","en":"house; many, much; miss, remember; fast","zh":"家；多；想念、記得；快","kind":"d","g":[["nhà,","家"],["nhiều,","多"],["nhớ,","想念、記得"],["nhanh","快"]]},"s0064":{"vi":"phở, phải, phim","note":"ph = f","hz":"","en":"phở; must, right; film","zh":"河粉；必須、對；電影","kind":"d","g":[["phở,","河粉"],["phải,","必須、對"],["phim","電影"]]},"s0065":{"vi":"gà, ghế, ga","note":"g, gh: a soft g with friction, like the g in Spanish \"amigo\"","hz":"","en":"chicken; chair; station (ga xe lửa)","zh":"雞；椅子；車站","kind":"d","g":[["gà,","雞"],["ghế,","椅子"],["ga","車站"]]},"s0066":{"vi":"Ừ, anh hiểu rồi.","note":"ừ: the casual yes to a friend or someone younger; dạ is what they say to you. hiểu rồi = got it","hz":"曉 (hiểu)","en":"Yeah, I get it now.","zh":"嗯，我懂了。","kind":"s","g":[["Ừ,","嗯"],["anh","我"],["hiểu","懂","曉"],["rồi.","了"]],"x":"ừ = the casual yes to a friend or someone younger. hiểu rồi = got it, 懂了."},"s0067":{"vi":"Anh về nhà.","note":"","hz":"","en":"I'm going home.","zh":"我回家。","kind":"s","g":[["Anh","我"],["về","回"],["nhà.","家"]],"x":"về = go back (home, to where you belong). No word for 'to': về nhà = 回家."},"s0068":{"vi":"Trưa nay ăn gì?","note":"","hz":"","en":"What are we having for lunch today?","zh":"今天中午吃什麼？","kind":"s","g":[["Trưa nay","今天中午"],["ăn","吃"],["gì?","什麼"]],"x":"nay after a time word = this: trưa nay, tối nay. The subject is dropped, as so often in Mandarin."},"s0069":{"vi":"Cái chai này bự quá.","note":"bự = big, colloquial Southern; lớn is the neutral word; Hanoi mostly to","hz":"","en":"This bottle is so big.","zh":"這個瓶子好大。","kind":"s","g":[["Cái","個"],["chai","瓶子"],["này","這"],["bự","大"],["quá.","好","過"]],"x":"classifier + noun + này = this…: cái chai này = 這個瓶子. này comes after the noun."},"s0070":{"vi":"Thôi, đủ rồi.","note":"","hz":"","en":"Okay, that's enough.","zh":"好了，夠了。","kind":"s","g":[["Thôi,","好了"],["đủ","夠"],["rồi.","了"]],"x":"thôi = stop, okay then, 算了 or 好了. đủ rồi = 夠了."},"s0071":{"vi":"Cà phê này ngon quá.","note":"","hz":"","en":"This coffee is so good.","zh":"這杯咖啡好好喝。","kind":"s","g":[["Cà phê","咖啡"],["này","這"],["ngon","好喝"],["quá.","好","過"]],"x":"No classifier needed here: cà phê này = this coffee. ngon = tasty, for food and drinks."},"s0072":{"vi":"Người Sài Gòn nói nhanh quá.","note":"","hz":"","en":"Saigon people talk so fast.","zh":"西貢人講話好快。","kind":"s","g":[["Người","人"],["Sài Gòn","西貢"],["nói","說話"],["nhanh","快"],["quá.","好","過"]],"x":"người + place = the people from there. How you do something follows the verb: nói nhanh = 說得快."},"s0073":{"vi":"Em nói chậm chút nha.","note":"nha: soft Southern particle for requests and friendly statements, like 喔 or 吧","hz":"","en":"Speak a bit slower, please.","zh":"你講慢一點喔。","kind":"s","g":[["Em","你"],["nói","說"],["chậm","慢"],["chút","一點"],["nha.","喔"]],"x":"chút = a bit, after the adjective: chậm chút = 慢一點. nha softens the request."},"s0074":{"vi":"Anh nghe không hiểu.","note":"","hz":"","en":"I don't understand (what I'm hearing).","zh":"我聽不懂。","kind":"s","g":[["Anh","我"],["nghe","聽"],["không","不"],["hiểu.","懂","曉"]],"x":"verb + không + result: nghe không hiểu = 聽不懂, exactly as in Mandarin."},"s0075":{"vi":"Cổ đẹp quá.","note":"cổ = cô ấy (she), Saigon contraction; Hanoi and formal speech: cô ấy","hz":"","en":"She's so pretty.","zh":"她好漂亮。","kind":"s","g":[["Cổ","她"],["đẹp","漂亮"],["quá.","好","過"]],"x":"cổ = cô ấy, she: a Saigon contraction."},"s0076":{"vi":"làm, làn, làng, lành","note":"four finals: -m, -n, -ng, -nh. In Saigon làn sounds like làng, and lành like lằn: short a, n at the teeth","hz":"","en":"do, work; lane; village; benign, gentle","zh":"做；車道；村；溫和、良性","kind":"d","g":[["làm,","做"],["làn,","車道"],["làng,","村"],["lành","溫和、良性"]]},"s0077":{"vi":"tin, tinh","note":"not the same word. The final is n in both, but the vowel differs: tin has a clear i, tinh pulls the vowel back toward ư, so it sounds like tưn. The palatal nh is gone in Saigon, yet it leaves its trace in the vowel, exactly as anh becomes ăn. Fast speech flattens the difference, careful speech keeps it. Hanoi keeps them apart by the final, n against nh. 不是同一個字：尾音都是 n，母音不同，tinh 的母音偏 ư。The voice says both alike, which is the fast Saigon form: you pull the vowel back. 錄音兩個唸一樣，你要把母音往後拉。","hz":"信 (tin) / 精 (tinh)","en":"believe, news; refined, spirit (tinh thần)","zh":"相信、消息；精（tinh thần 精神）","kind":"d","g":[["tin,","相信、消息"],["tinh","精（tinh thần 精神）"]]},"s0078":{"vi":"chín, chính","note":"same rule as tin and tinh: chín has a clear i, chính pulls the vowel toward ư. The n at the end is the same in both. This is the careful Saigon difference, not a Northern one: Hanoi keeps the difference in the final consonant instead, n against nh. 母音不同：chính 偏 ư，尾音都是 n。The voice says both alike, which is the fast Saigon form: you pull the vowel back. 錄音兩個唸一樣，你要把母音往後拉。","hz":"正 (chính)","en":"nine; main, exactly (chính xác)","zh":"九；正（chính xác 正確）","kind":"d","g":[["chín,","九"],["chính","正（chính xác 正確）"]]},"s0079":{"vi":"một, mộc","note":"these two really are the same in Saigon: after o, ô, u a final t turns into a k and the lips close. That is a Southern feature, not carelessness, and it stays. Hanoi keeps t and c apart","hz":"木 (mộc)","en":"one; wood (Sino)","zh":"一；木","kind":"d","g":[["một,","一"],["mộc","木"]]},"s0080":{"vi":"mắt, mắc","note":"really the same in Saigon: after ă a final t turns into a k. A Southern feature, not carelessness, and it stays; Hanoi keeps t and c apart","hz":"","en":"eye; expensive (Southern; Hanoi: đắt)","zh":"眼睛；貴（北部說 đắt）","kind":"d","g":[["mắt,","眼睛"],["mắc","貴（北部說 đắt）"]]},"s0081":{"vi":"tiếc, tiết","note":"really the same in Saigon: after iê a final t turns into a k. A Southern feature, not carelessness, and it stays; Hanoi keeps t and c apart","hz":"節 (tiết)","en":"regret, pity (tiếc quá); period, section (tiết học); tiết kiệm = save, economise","zh":"可惜；節（tiết học 一節課；tiết kiệm 節儉、節省）","kind":"d"},"s0082":{"vi":"tập, tất, tách","note":"tập: the lips close and stay closed; tất: in Saigon a k, like tấc; tách: a cut t with a short a, [tắt]. No puff of air, no release","hz":"習 (tập)","en":"practise; all (tất cả; for socks Saigon says vớ, Hanoi tất); cup","zh":"練習；全部（tất cả；襪子南部說 vớ，北部說 tất）；杯子","kind":"d"},"s0083":{"vi":"học, tốt, đẹp, sách","note":"all four end in a stopped consonant; such syllables only take the sắc or nặng tone","hz":"學 (học) / 冊 (sách)","en":"study; good; beautiful; book","zh":"學習；好；漂亮；書","kind":"d","g":[["học,","學習"],["tốt,","好"],["đẹp,","漂亮"],["sách","書"]]},"s0084":{"vi":"không, ông, đúng, uống","note":"after o, ô, u as the whole vowel, the final -ng closes the lips as well, like \"ngm\": không, ông, đúng. In uống the vowel is uô and ends open, so the lips do not close","hz":"","en":"no, not; grandfather, Mr; correct; drink","zh":"不；爺爺、先生；對；喝","kind":"d","g":[["không,","不"],["ông,","爺爺、先生"],["đúng,","對"],["uống","喝"]]},"s0085":{"vi":"học, đọc, cục, tốc","note":"after o, ô, u the final -c closes the lips too: like \"kp\"","hz":"學 (học) / 速 (tốc)","en":"study; read; lump, piece; speed (tốc độ)","zh":"學；讀；塊；速（tốc độ 速度）","kind":"d","g":[["học,","學"],["đọc,","讀"],["cục,","塊"],["tốc","速（tốc độ 速度）"]]},"s0086":{"vi":"anh, xanh, nhanh, khách","note":"-anh in Saigon: short a plus n at the teeth, [ăn]; -ach: short a plus a cut t, [ăt]","hz":"客 (khách)","en":"older brother, you; blue, green; fast; guest, customer","zh":"哥哥、你；藍、綠；快；客人","kind":"d","g":[["anh,","哥哥、你"],["xanh,","藍、綠"],["nhanh,","快"],["khách","客人"]]},"s0087":{"vi":"bệnh, kênh, ếch","note":"-ênh and -êch in Saigon: the palatal final becomes n and t, and the vowel pulls back toward ơ, so bệnh sounds close to bợn. You say bệnh; you will hear bịnh in the South, especially from older speakers. Hanoi keeps a clear ê and a palatal final. The voice keeps a clear ê here: you pull the vowel toward ơ 錄音的 ê 太清楚，你要把母音往 ơ 拉。","hz":"病 (bệnh)","en":"sick, illness; channel, canal; frog","zh":"病；頻道、運河；青蛙","kind":"d","g":[["bệnh,","病"],["kênh,","頻道、運河"],["ếch","青蛙"]]},"s0088":{"vi":"một, hai, ba, bốn, năm, sáu, bảy, tám, chín, mười","note":"một sounds like mộc, bốn like bống, chín keeps a clear i; năm and tám end in m; you will hear mừi for mười","hz":"","en":"one to ten","zh":"一到十","kind":"s","g":[["một,","一"],["hai,","二"],["ba,","三"],["bốn,","四"],["năm,","五"],["sáu,","六"],["bảy,","七"],["tám,","八"],["chín,","九"],["mười","十"]],"x":"The numbers one to ten. From eleven on they combine: mười một (11), hai mươi (20)."},"s0089":{"vi":"Anh ăn cơm rồi.","note":"ăn sounds like \"ăng\"","hz":"","en":"I've eaten already.","zh":"我吃過飯了。","kind":"s","g":[["Anh","我"],["ăn","吃"],["cơm","飯"],["rồi.","了"]],"x":"rồi at the end = already: the answer to Em ăn cơm chưa?"},"s0090":{"vi":"Chín giờ tối.","note":"","hz":"","en":"Nine in the evening.","zh":"晚上九點。","kind":"s","g":[["Chín","九"],["giờ","點"],["tối.","晚上"]],"x":"Number + giờ = o'clock; the part of the day comes after: chín giờ tối = 晚上九點."},"s0091":{"vi":"Cái này mắc quá.","note":"mắc = expensive, Southern; Hanoi: đắt","hz":"","en":"This is too expensive.","zh":"這個太貴了。","kind":"s","g":[["Cái này","這個"],["mắc","貴"],["quá.","太","過"]],"x":"cái này = this (thing), 這個. mắc = expensive in the South."},"s0092":{"vi":"Anh học tiếng Việt.","note":"","hz":"學 (học) / 越 (Việt)","en":"I'm learning Vietnamese.","zh":"我在學越南語。","kind":"s","g":[["Anh","我"],["học","學","學"],["tiếng Việt.","越南文","越"]],"x":"tiếng + country = its language: tiếng Việt, tiếng Đức, tiếng Anh."},"s0093":{"vi":"Em nói được tiếng Anh không?","note":"","hz":"英 (Anh)","en":"Can you speak English?","zh":"你會講英文嗎？","kind":"s","g":[["Em","你"],["nói","說"],["được","會"],["tiếng Anh","英文","英"],["không?","嗎"]],"x":"được after the verb = can, manage to, like 會 or 能: nói được tiếng Anh = 會說英文."},"s0094":{"vi":"Sách này hay lắm.","note":"","hz":"冊 (sách)","en":"This book is really good.","zh":"這本書很好看。","kind":"s","g":[["Sách","書","冊"],["này","這"],["hay","好看"],["lắm.","很"]],"x":"lắm after the adjective = very, really. hay = good, interesting, for books, films and songs."},"s0095":{"vi":"Không sao đâu.","note":"","hz":"","en":"No problem. / It's fine.","zh":"沒關係。","kind":"s","g":[["Không","沒"],["sao","事"],["đâu.","啦"]],"x":"không sao = no problem, 沒關係. đâu at the end makes the denial emphatic and reassuring: 啦."},"s0096":{"vi":"Anh không hiểu.","note":"","hz":"","en":"I don't understand.","zh":"我不懂。","kind":"s","g":[["Anh","我"],["không","不"],["hiểu.","懂","曉"]],"x":"không before the verb = not, 不."},"s0097":{"vi":"Anh là người Đức.","note":"","hz":"德 (Đức)","en":"I'm German.","zh":"我是德國人。","kind":"s","g":[["Anh","我"],["là","是"],["người","人"],["Đức.","德國","德"]],"x":"là + noun = to be. Inside người Đức the order flips against Mandarin: person first, then German."},"s0098":{"vi":"Anh là giáo viên tiếng Đức.","note":"","hz":"教員 (giáo viên) / 德 (Đức)","en":"I'm a teacher of German.","zh":"我是德文老師。","kind":"s","g":[["Anh","我"],["là","是"],["giáo viên","老師","教員"],["tiếng Đức.","德文","德"]],"x":"What describes a noun follows it: giáo viên tiếng Đức = teacher (of) German, 德文老師."},"s0099":{"vi":"Anh dạy tiếng Đức cho người Trung Quốc.","note":"người Trung Quốc = from China; người Hoa = ethnic Chinese in general, also the Chinese-Vietnamese in Saigon","hz":"中國 (Trung Quốc)","en":"I teach German to Chinese people.","zh":"我教中國人德文。","kind":"s","g":[["Anh","我"],["dạy","教"],["tiếng Đức","德文","德"],["cho","給"],["người","人"],["Trung Quốc.","中國","中國"]],"x":"dạy + what + cho + whom = teach something to someone. cho here = to, for; it follows the verb, where Mandarin puts 給 before it."},"s0100":{"vi":"Ba anh là người Việt.","note":"ba = dad, Southern; Hanoi: bố","hz":"越 (Việt)","en":"My dad is Vietnamese.","zh":"我爸是越南人。","kind":"s","g":[["Ba","爸爸"],["anh","我（的）"],["là","是"],["người","人"],["Việt.","越南","越"]],"x":"Possession: the owner follows the noun, ba anh = my dad. của (of) can be added but is usually left out."},"s0101":{"vi":"Má anh là người Trung Quốc.","note":"má = mom, Southern; Hanoi: mẹ","hz":"中國 (Trung Quốc)","en":"My mom is Chinese.","zh":"我媽是中國人。","kind":"s","g":[["Má","媽媽"],["anh","我（的）"],["là","是"],["người","人"],["Trung Quốc.","中國","中國"]],"x":"The same pattern: má anh = my mom."},"s0102":{"vi":"Anh nói được tiếng Trung.","note":"in Saigon \"tiếng Hoa\" is just as common for the Chinese language","hz":"中 (Trung)","en":"I can speak Chinese.","zh":"我會說中文。","kind":"s","g":[["Anh","我"],["nói","說"],["được","會"],["tiếng Trung.","中文","中"]],"x":"verb + được + object = can do it: 會說中文."},"s0103":{"vi":"Anh mới học tiếng Việt.","note":"","hz":"","en":"I just started learning Vietnamese.","zh":"我剛開始學越南語。","kind":"s","g":[["Anh","我"],["mới","剛"],["học","學","學"],["tiếng Việt.","越南文","越"]],"x":"mới before the verb = just, recently, 剛."},"s0104":{"vi":"Anh ở Đức.","note":"","hz":"德 (Đức)","en":"I live in Germany.","zh":"我住在德國。","kind":"s","g":[["Anh","我"],["ở","住"],["Đức.","德國","德"]],"x":"ở = be at, live in, with no extra verb: 我住在德國."},"s0105":{"vi":"Em ở đâu?","note":"","hz":"","en":"Where are you? / Where do you live?","zh":"你在哪裡？","kind":"s","g":[["Em","你"],["ở","住"],["đâu?","哪裡"]],"x":"đâu = where; like all question words it stands where the answer goes."},"s0106":{"vi":"Em ở Sài Gòn hả?","note":"hả: question particle for checking or mild surprise, like 喔 or 是嗎","hz":"","en":"You're in Saigon?","zh":"你在西貢喔？","kind":"s","g":[["Em","你"],["ở","在"],["Sài Gòn","西貢"],["hả?","喔"]],"x":"hả at the end checks what you think you heard: you're in Saigon, right?"},"s0107":{"vi":"Em làm nghề gì?","note":"","hz":"","en":"What do you do for a living?","zh":"你做什麼工作？","kind":"s","g":[["Em","你"],["làm","做"],["nghề","職業"],["gì?","什麼"]],"x":"làm nghề gì = do which job. Young people also just ask Em làm gì?"},"s0108":{"vi":"Em là sinh viên hả?","note":"","hz":"生員 (sinh viên)","en":"You're a student?","zh":"你是大學生喔？","kind":"s","g":[["Em","你"],["là","是"],["sinh viên","大學生","生員"],["hả?","喔"]],"x":"sinh viên = university student; a school pupil is học sinh."},"s0109":{"vi":"Ổng là ba anh.","note":"ổng = ông ấy (he, an older man), Saigon contraction; Hanoi and formal speech: ông ấy. About your own father it sounds casual, fine with friends, cheeky in front of older people","hz":"","en":"He is my dad.","zh":"他是我爸。","kind":"s","g":[["Ổng","他"],["là","是"],["ba","爸爸"],["anh.","我（的）"]],"x":"ổng = ông ấy, he (an older man). About your own father it sounds casual."},"s0110":{"vi":"Ảnh là người Sài Gòn.","note":"ảnh = anh ấy (he), Saigon contraction; Hanoi and formal speech: anh ấy","hz":"","en":"He's from Saigon.","zh":"他是西貢人。","kind":"s","g":[["Ảnh","他"],["là","是"],["người","人"],["Sài Gòn.","西貢"]],"x":"ảnh = anh ấy, he (a young man)."},"s0111":{"vi":"Cổ là bạn anh.","note":"","hz":"伴 (bạn)","en":"She's my friend.","zh":"她是我朋友。","kind":"s","g":[["Cổ","她"],["là","是"],["bạn","朋友","伴"],["anh.","我（的）"]],"x":"bạn anh = my friend: the owner after the noun again."},"s0112":{"vi":"Thiệt hả?","note":"thiệt: say this (Southern); Hanoi and writing: thật","hz":"","en":"Really?","zh":"真的嗎？","kind":"s","g":[["Thiệt","真的"],["hả?","喔"]],"x":"The most common reaction: really? thiệt is the Southern form of thật."},"s0113":{"vi":"Vậy hả?","note":"","hz":"","en":"Is that so? / Oh really?","zh":"是喔？","kind":"s","g":[["Vậy","這樣"],["hả?","喔"]],"x":"vậy = like that: is that so?, 是喔."},"s0114":{"vi":"Trời ơi, mắc quá!","note":"","hz":"","en":"Oh my god, so expensive!","zh":"天啊，好貴！","kind":"s","g":[["Trời","天"],["ơi,","啊"],["mắc","貴"],["quá!","太","過"]],"x":"trời ơi = oh my god, literally 天啊. ơi calls someone, here heaven."},"s0115":{"vi":"Em nói lại được không?","note":"","hz":"","en":"Can you say that again?","zh":"你可以再說一次嗎？","kind":"s","g":[["Em","你"],["nói","說"],["lại","再"],["được","可以"],["không?","嗎"]],"x":"lại after the verb = again. … được không? = can you…?, 可以…嗎."},"s0116":{"vi":"Thôi, anh đi ngủ nha.","note":"","hz":"","en":"Okay, I'm going to sleep now.","zh":"好了，我去睡了喔。","kind":"s","g":[["Thôi,","好了"],["anh","我"],["đi","去"],["ngủ","睡"],["nha.","喔"]],"x":"thôi opens a goodbye: okay then. đi ngủ = go to sleep."},"s0117":{"vi":"Ngủ ngon nghen.","note":"nghen: warm Southern particle, softer than nha; it sounds older or Mekong and fits your father; with tandems nha is the usual choice","hz":"","en":"Sleep well.","zh":"晚安喔。","kind":"s","g":[["Ngủ","睡"],["ngon","好"],["nghen.","喔"]],"x":"ngủ ngon = sleep well (ngon = tasty, here: deeply). nghen is a warmer nha."},"s0118":{"vi":"Mai nói tiếp nha.","note":"","hz":"","en":"Let's talk more tomorrow.","zh":"明天再聊喔。","kind":"s","g":[["Mai","明天"],["nói","說"],["tiếp","繼續","接"],["nha.","喔"]],"x":"tiếp after a verb = go on doing it: nói tiếp = 繼續說."},"s0119":{"vi":"Hẹn gặp lại.","note":"","hz":"","en":"See you again.","zh":"再見。","kind":"s","g":[["Hẹn","約"],["gặp","見"],["lại.","再"]],"x":"Literally: arrange to meet again, 再見."},"s0122":{"vi":"Em ơi, cái này tiếng Việt nói sao?","note":"em ơi: calling someone, as in a café or at the start of a message. sao at the end: how. Southern; Hanoi: thế nào (nói thế nào)","hz":"越 (Việt)","en":"Hey, how do you say this in Vietnamese?","zh":"欸，這個用越南文怎麼說？","kind":"s","g":[["Em","你"],["ơi,","欸"],["cái này","這個"],["tiếng Việt","越南文","越"],["nói","說"],["sao?","怎麼"]],"x":"The topic first, cái này (this thing), then the question about it. sao at the end = how, 怎麼."},"s0123":{"vi":"Chữ này nghĩa là gì?","note":"nghĩa: ngã, said like hỏi in Saigon, a dip then a rise","hz":"義 (nghĩa)","en":"What does this word mean?","zh":"這個字是什麼意思？","kind":"s","g":[["Chữ","字"],["này","這"],["nghĩa","意思","義"],["là","是"],["gì?","什麼"]],"x":"Literally 這個字意思是什麼: the Mandarin order, except that này follows the noun."},"s0124":{"vi":"Chữ này viết sao?","note":"viết: after iê the final t is said as c in Saigon, viếc","hz":"","en":"How do you write this word?","zh":"這個字怎麼寫？","kind":"s","g":[["Chữ","字"],["này","這"],["viết","寫"],["sao?","怎麼"]],"x":"sao after the verb = how: viết sao = 怎麼寫, nói sao = 怎麼說."},"s0125":{"vi":"Em nói vậy là sao?","note":"asks what someone means; said gently it is a real question, said sharply it sounds annoyed","hz":"","en":"What do you mean?","zh":"你這樣說是什麼意思？","kind":"s","g":[["Em","你"],["nói","說"],["vậy","這樣"],["là","是"],["sao?","怎麼"]],"x":"Literally: you say it like that, that is how? = what do you mean?"},"s0126":{"vi":"Em nói lại chậm chút được hông?","note":"hông = không in Saigon speech; at the end of a question it is the usual form. Hanoi: không","hz":"","en":"Can you say it again, a bit slower?","zh":"你可以慢一點再說一次嗎？","kind":"s","g":[["Em","你"],["nói","說"],["lại","再"],["chậm","慢"],["chút","一點"],["được","可以"],["hông?","嗎"]],"x":"Two additions after the verb: lại (again) and chậm chút (a bit slower). … được hông? = can you…?"},"s0127":{"vi":"Anh nghe hông kịp.","note":"kịp: nặng, short, the lips close at the end and stay closed. nghe hông kịp: can't keep up","hz":"","en":"I can't keep up (with what I hear).","zh":"我跟不上。","kind":"s","g":[["Anh","我"],["nghe","聽"],["hông","不"],["kịp.","來得及"]],"x":"verb + hông + kịp = not manage to keep up, 跟不上. The same frame as nghe không hiểu."},"s0128":{"vi":"Ủa, em ở Sài Gòn hả?","note":"ủa: hỏi tone; surprise, like 咦. Southern; Hanoi: ơ","hz":"","en":"Huh, you're in Saigon?","zh":"咦，你在西貢喔？","kind":"s","g":[["Ủa,","咦"],["em","你"],["ở","在"],["Sài Gòn","西貢"],["hả?","喔"]],"x":"ủa at the start shows surprise, hả at the end checks."},"s0129":{"vi":"Ủa, em chưa ngủ hả?","note":"","hz":"","en":"Huh, you're not asleep yet?","zh":"咦，你還沒睡喔？","kind":"s","g":[["Ủa,","咦"],["em","你"],["chưa","還沒"],["ngủ","睡"],["hả?","喔"]],"x":"chưa before the verb = not yet."},"s0130":{"vi":"Ủa, sao vậy?","note":"sao vậy: what's up, what happened. Hanoi: sao thế","hz":"","en":"Huh, what's wrong?","zh":"咦，怎麼了？","kind":"s","g":[["Ủa,","咦"],["sao vậy?","怎麼了"]],"x":"sao vậy = what's the matter, 怎麼了. Like 怎麼, sao covers how, why and what's wrong."},"s0131":{"vi":"Cà phê này ngon ha.","note":"ha at the end asks for agreement, soft and short, like 對吧 or 耶. Southern; Hanoi: nhỉ","hz":"","en":"This coffee is good, isn't it?","zh":"這杯咖啡很好喝，對吧？","kind":"s","g":[["Cà phê","咖啡"],["này","這"],["ngon","好喝"],["ha.","對吧"]],"x":"ha at the end invites agreement: 對吧、耶."},"s0132":{"vi":"Em nói tiếng Anh giỏi ha.","note":"giỏi: gi is y, hỏi tone, yỏi","hz":"英 (Anh)","en":"You speak English really well, huh.","zh":"你英文講得很好耶。","kind":"s","g":[["Em","你"],["nói","說"],["tiếng Anh","英文","英"],["giỏi","很好"],["ha.","耶"]],"x":"The judgement comes after the verb phrase: nói tiếng Anh giỏi = 英文說得好."},"s0133":{"vi":"Cái này ngon lắm luôn.","note":"luôn: n after uô is said as ng, luông. After lắm it means really, totally, like 超","hz":"","en":"This is really, really good.","zh":"這個超好吃。","kind":"s","g":[["Cái này","這個"],["ngon","好吃"],["lắm","很"],["luôn.","超"]],"x":"lắm luôn = really, totally: a stronger lắm."},"s0134":{"vi":"Vậy hả? Anh không biết luôn.","note":"luôn after a negative: at all. Southern colloquial; Hanoi: không biết gì cả","hz":"","en":"Really? I had no idea at all.","zh":"是喔？我完全不知道。","kind":"s","g":[["Vậy","這樣"],["hả?","喔"],["Anh","我"],["không","不"],["biết","知道"],["luôn.","完全"]],"x":"luôn after a negative = at all: không biết luôn = 完全不知道."},"s0135":{"vi":"Phở ngon lắm á.","note":"á at the end: you know, I'm telling you, like 喔 or 耶. Southern; Hanoi: đấy (ngon lắm đấy)","hz":"","en":"Phở is really good, you know.","zh":"河粉很好吃喔。","kind":"s","g":[["Phở","河粉"],["ngon","好吃"],["lắm","很"],["á.","喔"]],"x":"á at the end tells: I'm telling you, 喔、耶."},"s0136":{"vi":"Em ăn đi.","note":"đi at the end makes an invitation: go ahead, like 吧","hz":"","en":"Go ahead and eat.","zh":"你吃吧。","kind":"s","g":[["Em","你"],["ăn","吃"],["đi.","吧"]],"x":"đi at the end turns it into an invitation, 吧."},"s0137":{"vi":"Em đi ngủ đi.","note":"the first đi is go, the second softens the request","hz":"","en":"Go to sleep.","zh":"你去睡吧。","kind":"s","g":[["Em","你"],["đi","去"],["ngủ","睡"],["đi.","吧"]],"x":"The first đi is go, the second the invitation: 你去睡吧."},"s0138":{"vi":"Thôi, vậy đi.","note":"vậy đi: let's do it that way","hz":"","en":"Okay, let's do that.","zh":"好，就這樣吧。","kind":"s","g":[["Thôi,","好"],["vậy","這樣"],["đi.","吧"]],"x":"vậy đi = let's do it like that, 就這樣吧."},"s0139":{"vi":"Thiệt hông em?","note":"thiệt hông really asks whether it is true; thiệt hả mostly shows surprise","hz":"","en":"Really?","zh":"真的嗎？","kind":"s","g":[["Thiệt","真的"],["hông","嗎"],["em?","你"]],"x":"hông as the question word, then the person you ask. It really asks whether it is true."},"s0140":{"vi":"Trời, dữ vậy!","note":"dữ: d is y, ngã said like hỏi, yữ. dữ vậy: wow, that much. Southern; Hanoi: ghê thế","hz":"","en":"Wow, seriously!","zh":"天啊，這麼誇張！","kind":"s","g":[["Trời,","天啊"],["dữ","誇張"],["vậy!","這麼"]],"x":"dữ vậy = that intense, that much: 這麼誇張、這麼厲害."},"s0141":{"vi":"Ờ ha, anh quên rồi.","note":"ờ ha: oh right. quên: keep the k, kwên","hz":"","en":"Oh right, I forgot.","zh":"對喔，我忘了。","kind":"s","g":[["Ờ","喔"],["ha,","對"],["anh","我"],["quên","忘"],["rồi.","了"]],"x":"ờ ha = oh right. quên rồi = forgot, 忘了."},"s0142":{"vi":"Anh gửi em nè.","note":"nè at the end: here, look, when you hand or send something. Southern; Hanoi: này. gửi is also written gởi in the South","hz":"","en":"Here, I'm sending it to you.","zh":"我傳給你喔。","kind":"s","g":[["Anh","我"],["gửi","傳"],["em","你"],["nè.","給你"]],"x":"gửi + person = send to someone. nè when you hand something over: here you go."},"s0143":{"vi":"Em nhắn cho anh nha.","note":"nhắn: after ă the final n is said as ng, nhắng","hz":"","en":"Text me, okay?","zh":"你傳訊息給我喔。","kind":"s","g":[["Em","你"],["nhắn","傳訊息"],["cho","給"],["anh","我"],["nha.","喔"]],"x":"nhắn cho + person = text someone, 傳訊息給…."},"s0144":{"vi":"Giờ anh mới biết.","note":"giờ at the start: now. mới here: only then, like 才","hz":"","en":"I only just found out.","zh":"我現在才知道。","kind":"s","g":[["Giờ","現在"],["anh","我"],["mới","才"],["biết.","知道"]],"x":"mới before the verb here = only then, 才, as in 我現在才知道."},"s0145":{"vi":"Anh gửi voice cho em nha.","note":"voice: roughly the English word; tandems say gửi voice for a voice message","hz":"","en":"I'll send you a voice message.","zh":"我傳語音給你喔。","kind":"s","g":[["Anh","我"],["gửi","傳"],["voice","語音"],["cho","給"],["em","你"],["nha.","喔"]],"x":"gửi + thing + cho + person: send something to someone."},"s0146":{"vi":"Mình gọi video hông?","note":"mình: we, you and I together. gọi video: video call","hz":"","en":"Shall we do a video call?","zh":"我們視訊好嗎？","kind":"s","g":[["Mình","我們"],["gọi video","視訊"],["hông?","好嗎"]],"x":"mình = we, you and I. A suggestion as a question: shall we…?"},"s0147":{"vi":"Anh đang học gõ tiếng Việt.","note":"gõ: type on a keyboard; ngã said like hỏi. đang: in the middle of, like 在","hz":"學 (học) / 越 (Việt)","en":"I'm learning to type Vietnamese.","zh":"我在學打越南文。","kind":"s","g":[["Anh","我"],["đang","正在"],["học","學","學"],["gõ","打字"],["tiếng Việt.","越南文","越"]],"x":"đang before the verb = in the middle of, 在、正在."},"s0148":{"vi":"Anh viết sai hả?","note":"","hz":"","en":"Did I write it wrong?","zh":"我寫錯了嗎？","kind":"s","g":[["Anh","我"],["viết","寫"],["sai","錯"],["hả?","喔"]],"x":"The result follows the verb: viết sai = 寫錯."},"s0149":{"vi":"Em sửa giùm anh nha.","note":"giùm: gi is y, yùm; for me, as a favour. Southern; Hanoi: hộ (giúp is neutral everywhere)","hz":"","en":"Please correct it for me.","zh":"你幫我改一下喔。","kind":"s","g":[["Em","你"],["sửa","改"],["giùm","幫"],["anh","我"],["nha.","喔"]],"x":"verb + giùm + person = do it for someone: sửa giùm anh = 幫我改."},"s0150":{"vi":"Cảm ơn em nhiều nha.","note":"","hz":"感恩 (cảm ơn)","en":"Thanks a lot.","zh":"太謝謝你了。","kind":"s","g":[["Cảm ơn","謝謝","感恩"],["em","你"],["nhiều","很多"],["nha.","喔"]],"x":"nhiều after the thanks = a lot."},"s0151":{"vi":"Có gì đâu.","note":"the answer when someone thanks you; đâu makes it light","hz":"","en":"It's nothing.","zh":"沒什麼啦。","kind":"s","g":[["Có","有"],["gì","什麼"],["đâu.","哪有"]],"x":"có … đâu = there is no … at all: đâu turns it into a denial, 沒什麼啦. Without đâu, Có gì? is a real question."},"s0152":{"vi":"Tiếng Việt khó quá.","note":"khó: an aspirated k","hz":"越 (Việt)","en":"Vietnamese is so hard.","zh":"越南文好難。","kind":"s","g":[["Tiếng Việt","越南文","越"],["khó","難"],["quá.","好","過"]],"x":"An adjective as the predicate again: no 是 needed."},"s0153":{"vi":"Nhưng mà vui lắm.","note":"nhưng mà: but, in speech often just mà","hz":"","en":"But it's a lot of fun.","zh":"但是很好玩。","kind":"s","g":[["Nhưng mà","但是"],["vui","好玩"],["lắm.","很"]],"x":"nhưng mà = but; vui = fun, happy."}},"lessons":[{"key":"l01","n":1,"title":"The Saigon sound system","ids":["s0001","s0002","s0003","s0004","s0005","s0006","s0007","s0008","s0009","s0010","s0120","s0121","s0011","s0012","s0013","s0014","s0015","s0016","s0017","s0018","s0019","s0020","s0021","s0022","s0023","s0024","s0025","s0026","s0027","s0028","s0029","s0030","s0031","s0032","s0033","s0034","s0035","s0036","s0037","s0038","s0039","s0040","s0041","s0042","s0043","s0044","s0045","s0046","s0047","s0048","s0049","s0050","s0051","s0052","s0053","s0054","s0055","s0056","s0057","s0058","s0059","s0060","s0061","s0062","s0063","s0064","s0065","s0066","s0067","s0068","s0069","s0070","s0071","s0072","s0073","s0074","s0075","s0076","s0077","s0078","s0079","s0080","s0081","s0082","s0083","s0084","s0085","s0086","s0087","s0088","s0089","s0090","s0091","s0092","s0093","s0094","s0095","s0096","s0097","s0098","s0099","s0100","s0101","s0102","s0103","s0104","s0105","s0106","s0107","s0108","s0109","s0110","s0111","s0112","s0113","s0114","s0115","s0116","s0117","s0118","s0119"],"drills":["s0011","s0012","s0013","s0014","s0015","s0016","s0017","s0018","s0019","s0020","s0021","s0022","s0023","s0024","s0025","s0026","s0027","s0028","s0029","s0030","s0031","s0032","s0033","s0034","s0043","s0044","s0045","s0046","s0047","s0048","s0049","s0050","s0051","s0052","s0053","s0054","s0055","s0056","s0057","s0058","s0059","s0060","s0061","s0062","s0063","s0064","s0065","s0076","s0077","s0078","s0079","s0080","s0081","s0082","s0083","s0084","s0085","s0086","s0087"],"pages":[{"t":"How this app works","h":"<p>You studied lesson 1 from the booklet. Its 62 sentences are already counted as met and come back as reviews over the first five days, in the order of the old booklet days.<\/p>\n<p>Every day there is one round of fifteen minutes; you can change the minutes on the home screen. First the sentences that are due again, then as many new ones as fit. If the reviews pile up, the new sentences wait until they are through.<\/p>\n<p>Nothing plays by itself, and you never have to press Play to go on. Press Play, say the sentence in the pause, press Play again and say it on top of the voice, as often as you like. Then <b>Again<\/b> if it did not come out, <b>Got it<\/b> if it came out fluently, <b>Easy<\/b> if it is so easy that seeing it again soon would waste your time. Again brings the card back a few cards later; Got it sends it further into the future each time.<\/p>\n<p>Once you have pressed Got it for a sentence three times (twice for the lesson 1 sentences, which start one step in), it comes as its meaning only. Say it in Vietnamese, out loud, then press Check and compare with the voice.<\/p>\n<p>The rows of single words from the booklet, the sound drills, are not practised in the app, except the numbers one to ten. They stay in the sentence list and on these pages, to listen to whenever you like.<\/p>\n<p>Slow plays the sentence at three quarters of the speed, same pitch. A dotted syllable means the voice gets that sound wrong; tap it to see what you say instead.<\/p>\n<p>After the round comes the tandem task. There is no check-in: the app notices which sentences are hard, and the next lessons bring them back. Under Practise you can go through any lesson freely; that never disturbs the plan, and Again there brings a sentence into tomorrow's round.<\/p>"},{"t":"The five Saigon tones","h":"<p>Vietnamese spelling shows six tones. Saigon has five, because hỏi (ả) and ngã (ã) are pronounced the same. Your Mandarin gives you the categories; not all of the contours are the Mandarin ones.<\/p>\n<div class=\"tw\"><table><tr><th>tone<\/th><th>mark<\/th><th>Saigon contour<\/th><th>Mandarin comparison<\/th><\/tr><tr><td>ngang<\/td><td>none<\/td><td>mid, flat<\/td><td>like tone 1 but lower, 33 rather than 55<\/td><\/tr><tr><td>huyền<\/td><td>à<\/td><td>low, falling gently, relaxed<\/td><td>not tone 4: it starts low and falls softly, no force<\/td><\/tr><tr><td>sắc<\/td><td>á<\/td><td>rising<\/td><td>tone 2, nearly identical; on syllables ending in p, t, c, ch it is short and high<\/td><\/tr><tr><td>hỏi / ngã<\/td><td>ả, ã<\/td><td>dips, then rises, longer than the others<\/td><td>a full tone 3 (214), the one you use in isolation<\/td><\/tr><tr><td>nặng<\/td><td>ạ<\/td><td>low, falling, a slight rise at the end, no catch in the throat; short only on syllables ending in p, t, c, ch<\/td><td>the half third tone, like 好 in 好吃<\/td><\/tr><\/table><\/div>\n<p>Listen for how low nặng sits, how long hỏi is, and that huyền has no energy in it.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0011\"><\/div><div class=\"pl\" data-id=\"s0012\"><\/div><div class=\"pl\" data-id=\"s0013\"><\/div><div class=\"pl\" data-id=\"s0014\"><\/div><div class=\"pl\" data-id=\"s0015\"><\/div><\/div>\n<p>If the voice makes a break in the middle of ngã words (cũng, nữa, mã), that is the Northern realisation. The app does not dot these; just say them exactly like the hỏi words.<\/p>\n<h3>Pronouns<\/h3>\n<p>anh = I (a man, to someone younger) and also you (when they address you). em = you (to someone younger) and I (when they speak). Your tandems call you anh and themselves em; you do the reverse. tôi is the neutral I; tui, mình, bạn and the rest come in lesson 4.<\/p>\n<h3>Greetings<\/h3>\n<p>Chào em is said quickly, as one unit. Dạ is not \"yes\" in the German sense; it shows that you are listening politely, and it starts almost every answer to someone you want to be polite to. It is mostly the younger person's word: as anh you will hear it from your tandems more often than you say it.<\/p>"},{"t":"Vowels","h":"<p>Twelve vowel letters (i and y share a sound), six of them with a hook or hat that changes the sound entirely. German gives you most of the qualities; the danger is length. Vietnamese a is long, ă and â are short, and length is not decorative: mắt, mất, mát are three words.<\/p>\n<div class=\"tw\"><table><tr><th>letters<\/th><th>sound<\/th><th>nearest German or Mandarin sound<\/th><\/tr><tr><td>a<\/td><td>long, open<\/td><td>Bahn<\/td><\/tr><tr><td>ă<\/td><td>same quality, very short, clipped<\/td><td>the a in \"hat\", cut even shorter<\/td><\/tr><tr><td>â<\/td><td>short, central, mouth half closed<\/td><td>the e in \"bitte\", or Mandarin 恩 without the n<\/td><\/tr><tr><td>e<\/td><td>open<\/td><td>Bett<\/td><\/tr><tr><td>ê<\/td><td>closed<\/td><td>Beet<\/td><\/tr><tr><td>i, y<\/td><td>same sound, spelling only<\/td><td>Mandarin 一<\/td><\/tr><tr><td>o<\/td><td>open, rounded<\/td><td>offen<\/td><\/tr><tr><td>ô<\/td><td>closed, rounded<\/td><td>Ofen, Mandarin 喔<\/td><\/tr><tr><td>ơ<\/td><td>unrounded ô, mouth relaxed, long<\/td><td>close to the e of Mandarin 餓; â is its short partner<\/td><\/tr><tr><td>u<\/td><td>closed, rounded<\/td><td>Mandarin 烏<\/td><\/tr><tr><td>ư<\/td><td>u with the lips spread as for i<\/td><td>no clean match; start from u and unround<\/td><\/tr><\/table><\/div>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0020\"><\/div><div class=\"pl\" data-id=\"s0025\"><\/div><\/div>\n<h3>Glides<\/h3>\n<p>ia, ua, ưa at the end of a syllable are i, u, ư gliding into a lazy ơ. Before a final consonant they are written iê, uô, ươ and sound the same. So bia and biết share the same first half, and mua and muốn do too. In Saigon you will often hear them shrink before i, u, m, p: người like ngừi, hiểu like hỉu.<\/p>\n<p>Take the minimal sets slowly: three words, three lengths. If mắt comes out like mát, you are lengthening ă; if mắt and mất merge, your â is too open.<\/p>"},{"t":"Initial consonants","h":"<p>This is where Saigon and Hanoi differ most, and where your Mandarin does the most work.<\/p>\n<div class=\"tw\"><table><tr><th>spelling<\/th><th>Saigon sound<\/th><th>Mandarin or German anchor<\/th><\/tr><tr><td>d, gi<\/td><td>y as in \"yes\"<\/td><td>Mandarin 一 onset (yī)<\/td><\/tr><tr><td>đ<\/td><td>a real d, with a slight inward gulp<\/td><td>German d is accepted<\/td><\/tr><tr><td>v<\/td><td>v<\/td><td>German w<\/td><\/tr><tr><td>r<\/td><td>tongue curled back, close to an English r<\/td><td>Mandarin r in 日<\/td><\/tr><tr><td>tr<\/td><td>curled-back t, like Mandarin zh<\/td><td>知<\/td><\/tr><tr><td>ch<\/td><td>flat t-plus-sh, like Mandarin j<\/td><td>機<\/td><\/tr><tr><td>s<\/td><td>curled-back s, like Mandarin sh<\/td><td>是<\/td><\/tr><tr><td>x<\/td><td>plain s<\/td><td>Mandarin s, 四<\/td><\/tr><tr><td>t<\/td><td>unaspirated t<\/td><td>Mandarin d, 大<\/td><\/tr><tr><td>th<\/td><td>aspirated t<\/td><td>Mandarin t, 他<\/td><\/tr><tr><td>c, k<\/td><td>unaspirated k<\/td><td>Mandarin g, 個<\/td><\/tr><tr><td>kh<\/td><td>aspirated k (Hanoi adds friction, like the ch in \"Bach\")<\/td><td>Mandarin k, 卡<\/td><\/tr><tr><td>qu<\/td><td>kw: careful Saigon keeps the k, quá and not wá<\/td><td>Mandarin 瓜 (guā)<\/td><\/tr><tr><td>ng, ngh<\/td><td>the ng of \"sing\", at the start<\/td><td>German \"Angst\" without the A<\/td><\/tr><tr><td>nh<\/td><td>ñ<\/td><td>Spanish \"señor\"<\/td><\/tr><tr><td>ph<\/td><td>f<\/td><td>Mandarin f<\/td><\/tr><tr><td>g, gh<\/td><td>soft g with friction<\/td><td>Spanish \"amigo\"<\/td><\/tr><tr><td>b<\/td><td>b with a slight inward gulp<\/td><td>German b is accepted<\/td><\/tr><\/table><\/div>\n<p>The two big habits to fight are German ones. First, German t, p, k are aspirated at the start of a word; Vietnamese t, c are not, and th, kh are. Use your Mandarin pairs d/t and g/k, they map exactly. Second, German has no ng at the beginning of a syllable. Say \"singen\", stop after \"sing\", then start \"ngon\" from that position.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0043\"><\/div><div class=\"pl\" data-id=\"s0049\"><\/div><div class=\"pl\" data-id=\"s0061\"><\/div><\/div>\n<h3>Saigon versus the written form<\/h3>\n<p>d, gi and r are three spellings that Hanoi reads as one sound (z). Saigon reads d and gi as y and keeps r apart. That is why a Saigon speaker hears the difference between ra and da, and why you should too.<\/p>\n<p>The minimal pairs are for your ear as much as your mouth. When you play one on these pages, listen three times before you say it.<\/p>"},{"t":"Careful Saigon, fast Saigon, Hanoi","h":"<p>Three things get mixed up under the word \"correct\", so hold them apart.<\/p>\n<p>The first is care. Inside Saigon there is a careful form and a fast form of the same accent. Careful keeps the k in qu (quá, not wá), keeps v as v (về, not yề), keeps s apart from x and tr apart from ch. Fast speech drops all four. Careful Saigon is what you produce, because it is never wrong in any situation, and because dropping a distinction later costs nothing while adding one costs months.<\/p>\n<p>The second is dialect. d and gi are y in the South and z in the North. r is curled back in the South and z in the North. The five tones with hỏi and ngã falling together are Southern, and so are the finals: một sounds like mộc, and tinh loses its nh but keeps a trace of it in the vowel. None of this is carelessness and none of it gets \"corrected\". You never produce the Northern forms; they are named in the notes so that you understand a Hanoi speaker, nothing more.<\/p>\n<p>The trap sits where the two meet. qu with its k sounds the same in careful Saigon and in Hanoi, so someone might tell you that the careful form is the Northern one. It is not, it is simply the careful one. But if a correction ever asks you to say dạ as zạ, or to split hỏi from ngã, that is not care any more, that is the Hanoi accent, and you decline it: your goal is to sound like a Saigon speaker in their twenties, not like a news reader from the North.<\/p>"},{"t":"Final consonants","h":"<p>Neither Mandarin nor German prepares you for Vietnamese finals. Mandarin has only n and ng at the end; German has every consonant but releases them with a puff. Vietnamese has eight finals and never releases the stops.<\/p>\n<div class=\"tw\"><table><tr><th>final<\/th><th>how<\/th><th>Saigon<\/th><\/tr><tr><td>-m<\/td><td>close the lips, hum<\/td><td>same as written<\/td><\/tr><tr><td>-n<\/td><td>tongue at the teeth<\/td><td>after every vowel except i and ê (iê follows the rule: tiền like tiềng) it becomes -ng<\/td><\/tr><tr><td>-ng<\/td><td>back of the tongue<\/td><td>after o, ô, u as the whole vowel the lips close at the same moment: \"ngm\" (not after uô: uống)<\/td><\/tr><tr><td>-nh<\/td><td>the nh of nhà, at the end<\/td><td>after a: anh is [ăn], short a and n at the teeth; after i and ê: n, and the vowel pulls back toward ư or ơ<\/td><\/tr><tr><td>-p, -t, -c, -ch<\/td><td>stop, hold, no release, no puff<\/td><td>the syllable ends in silence<\/td><\/tr><tr><td>-t<\/td><td>tongue at the teeth, no release<\/td><td>after every vowel except i and ê (iê follows the rule: tiết like tiếc) it becomes -c<\/td><\/tr><tr><td>-c<\/td><td>back of the tongue, no release<\/td><td>after o, ô, u the lips close too: \"kp\"<\/td><\/tr><tr><td>-ch<\/td><td>a stopped nh<\/td><td>after a: sách is [sắt], short a and a cut t; after i and ê: a cut t, the vowel pulls back the same way<\/td><\/tr><\/table><\/div>\n<h3>What sounds the same, and what only nearly does<\/h3>\n<p>These pairs really are the same in Saigon, and your tandems will say them that way:<\/p>\n<ul><li>ăn = ăng, bàn = bàng, tiền = tiềng (-n becomes -ng)<\/li><li>mắt = mắc, một = mộc, tiết = tiếc (-t becomes -c)<\/li><\/ul>\n<p>These are not the same, although fast speech and the voice flatten them:<\/p>\n<ul><li>tin and tinh, chín and chính, xin and xinh. The final is n in both, but tinh pulls the vowel back toward ư, so it sounds like tưn, and chính like chứn. Two words, kept apart in careful speech.<\/li><li>bệnh, kênh, ếch: after ê the vowel pulls toward ơ, so bệnh is close to bợn.<\/li><\/ul>\n<p>anh ends in a real n at the teeth, [ăn]; ăn ends in ng, [ăng]. They differ only in the final, the other way round from what the spelling suggests. sách ends in a cut t, [sắt]; sát itself ends in c, [sác]. This is why your spelling will be learned from reading, not from hearing.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0076\"><\/div><div class=\"pl\" data-id=\"s0077\"><\/div><div class=\"pl\" data-id=\"s0079\"><\/div><\/div>\n<h3>Stopped syllables and tone<\/h3>\n<p>A syllable ending in p, t, c, ch can only carry sắc or nặng: short high, or short low. Listen to học, tốt, đẹp, sách: two are high, two are low, all four are cut. If a final sounds like a German word ending, with a small puff after the t, cut the air off with the tongue or lips and leave it there.<\/p>\n<h3>Numbers<\/h3>\n<p>One to ten as a row, because they are a finals drill in disguise: một (t said as c, lips close), bốn (n said as ng, lips close), năm and tám (m), chín (n at the teeth, clear i, not chính), mười (full glide in careful speech; you will hear mừi). Say them as a chain until they run.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0088\"><\/div><\/div>"},{"t":"Who you are, in Saigon Vietnamese","h":"<p>The sounds now carry content: the self-introduction you send to every tandem, plus the Saigon contractions and particles that make it sound like Saigon rather than a textbook.<\/p>\n<h3>The persona sentences<\/h3>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0097\"><\/div><div class=\"pl\" data-id=\"s0098\"><\/div><div class=\"pl\" data-id=\"s0099\"><\/div><div class=\"pl\" data-id=\"s0100\"><\/div><div class=\"pl\" data-id=\"s0101\"><\/div><div class=\"pl\" data-id=\"s0102\"><\/div><div class=\"pl\" data-id=\"s0103\"><\/div><\/div>\n<p>Seven sentences, and they answer the first seven questions every Vietnamese person asks. Learn them as one block.<\/p>\n<p>Note ba and má: that is how the South says dad and mom. Hanoi says bố and mẹ; you will read those, never say them.<\/p>\n<h3>Saigon contractions<\/h3>\n<p>anh ấy becomes ảnh, cô ấy becomes cổ, ông ấy becomes ổng, bà ấy becomes bả, chị ấy becomes chỉ. The pair becomes one syllable with a hỏi tone. In casual Saigon speech everyone says these; the full forms belong to polite or formal speech. About your own parents ổng and bả sound casual: fine with friends, cheeky in front of older people.<\/p>\n<h3>Particles<\/h3>\n<ul><li>hả at the end turns a statement into a checking question, like 是喔 or 嗎 with a raised eyebrow.<\/li><li>nha softens a request or a statement, close to 喔 or 吧. It is soft and short; do not stress it.<\/li><li>nghen is the warmer, more familiar nha. It sounds older or Mekong; it fits your father, while tandems in their twenties write nha.<\/li><li>Thiệt hả? and Vậy hả? are the two reactions you will hear most in a chat. Thiệt is the Southern form of thật.<\/li><\/ul>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0106\"><\/div><div class=\"pl\" data-id=\"s0073\"><\/div><div class=\"pl\" data-id=\"s0117\"><\/div><div class=\"pl\" data-id=\"s0112\"><\/div><div class=\"pl\" data-id=\"s0113\"><\/div><\/div>\n<h3>Mandarin bridge<\/h3>\n<p>Anh là người Đức = 我是德國人, but inside người Đức the order flips: person first, then German. Anh nói được tiếng Trung: được after the verb is like 得 in 聽得懂, or simply 會, \"can, manage to\". Trung Quốc is 中國 read in Hán Việt: 中 = trung, 國 = quốc.<\/p>"},{"t":"How a Vietnamese sentence works","h":"<p>The good news first: Vietnamese grammar is close to Mandarin. Words never change. There is no conjugation, no plural ending, no article, and no tense inside the verb. The order is subject, verb, object, as in 我學越南文.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0092\"><\/div><div class=\"pl\" data-id=\"s0037\"><\/div><\/div>\n<h3>No 是 before an adjective<\/h3>\n<p>An adjective is the predicate on its own, as in 我很累. là only links two nouns, like 是 between nouns.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0042\"><\/div><div class=\"pl\" data-id=\"s0097\"><\/div><\/div>\n<h3>What describes a noun comes after it<\/h3>\n<p>This is the biggest difference from Mandarin. 德國人 is người Đức (person, German), 這個瓶子 is cái chai này (thing, bottle, this), 德文老師 is giáo viên tiếng Đức (teacher, German), 我爸 is ba anh (dad, me).<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0098\"><\/div><div class=\"pl\" data-id=\"s0069\"><\/div><div class=\"pl\" data-id=\"s0100\"><\/div><\/div>\n<p>The same goes for phrases with ở (at), cho (to, for) and với (with): they follow the verb, where Mandarin puts 在、給、跟 before it. 我教中國人德文 becomes anh dạy tiếng Đức cho người Trung Quốc.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0099\"><\/div><\/div>\n<h3>Pronouns are family words<\/h3>\n<p>You do not say I and you; you say what you are to each other. To someone younger you are anh and they are em. To your father you are con and he is ba. Even thanks names the person.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0004\"><\/div><div class=\"pl\" data-id=\"s0005\"><\/div><div class=\"pl\" data-id=\"s0006\"><\/div><\/div>\n<h3>Negation and yes-or-no questions<\/h3>\n<p>không before the verb is 不 or 沒. At the end of a sentence it turns it into a yes-or-no question, like 嗎. Question words stay where the answer goes, as in Mandarin.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0096\"><\/div><div class=\"pl\" data-id=\"s0003\"><\/div><div class=\"pl\" data-id=\"s0009\"><\/div><\/div>\n<h3>Already and not yet: rồi and chưa<\/h3>\n<p>rồi at the end of the verb phrase is 了, already. chưa at the end asks whether it has happened yet, 了嗎; before the verb it means 還沒.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0120\"><\/div><div class=\"pl\" data-id=\"s0121\"><\/div><div class=\"pl\" data-id=\"s0041\"><\/div><\/div>\n<h3>How much: rất, quá, lắm<\/h3>\n<p>rất goes before the adjective (很). quá and lắm go after it: quá in exclamations (好…喔、太), lắm for really, very.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0010\"><\/div><div class=\"pl\" data-id=\"s0035\"><\/div><div class=\"pl\" data-id=\"s0094\"><\/div><\/div>\n<h3>Small words around the verb<\/h3>\n<p>được after the verb means can (會、能). lại after the verb means again (再), tiếp means go on (繼續). chút after an adjective means a bit (一點). mới before the verb means just (剛).<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0102\"><\/div><div class=\"pl\" data-id=\"s0115\"><\/div><div class=\"pl\" data-id=\"s0118\"><\/div><div class=\"pl\" data-id=\"s0073\"><\/div><div class=\"pl\" data-id=\"s0103\"><\/div><\/div>\n<h3>Ordering<\/h3>\n<p>Cho anh + number + classifier + thing: give me…. The classifier stands between the number and the noun, as in 一杯咖啡: ly for a glass, tô for a big bowl.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0038\"><\/div><div class=\"pl\" data-id=\"s0039\"><\/div><\/div>"},{"t":"Four places where you beat the voice","h":"<p>The voice is a model, not a person from Saigon, and it gets four sounds wrong. In the app every syllable with r, tr, s or a palatal final after i or ê is dotted; tap it to see what you say instead.<\/p>\n<p>One thing first: many people in Taiwan say zh, ch and sh flat. For tr and s use the textbook, curled-back Mandarin of 知 and 是, or your Mandarin will merge them too.<\/p>\n<p>1. <b>r<\/b> comes out as a z. You say it curled back like the Mandarin 日: ra, not za.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0049\"><\/div><\/div>\n<p>2. <b>tr and ch<\/b> sound the same in the voice. You keep them apart: tr curled back like 知, ch flat like 機. con trai and cái chai are two different things.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0051\"><\/div><\/div>\n<p>3. <b>s and x<\/b> sound the same in the voice. You keep them apart: s curled back like 是, x a plain s like 四.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0054\"><\/div><\/div>\n<p>4. <b>chín and chính<\/b> sound the same in the voice. The final n really is the same in both, but the vowel is not: chín has a clear i, chính pulls toward ư. The same with tin and tinh, and after ê the trace goes toward ơ.<\/p>\n<div class=\"exs\"><div class=\"pl\" data-id=\"s0078\"><\/div><\/div>\n<p>Listen to these four once, deliberately. Then you know them for the rest of the course.<\/p>"},{"t":"Words in this lesson","h":"<p>112 words, in the order you meet them. The button plays the sentence where each one first comes up.<\/p><div class=\"wls\"><div class=\"wl\"><div class=\"wlt\"><b>chào<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">打招呼、你好<\/div><div class=\"wle\">hi, hello<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0001\" data-id=\"s0001\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>em<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">弟弟妹妹；你（對比你小的人）<\/div><div class=\"wle\">younger sibling; you (to someone younger); I (said by the younger one)<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0001\" data-id=\"s0001\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>anh<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">哥哥；我（對比自己小的人說）；你<\/div><div class=\"wle\">older brother; I (a man to someone younger); you (to an older man)<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0002\" data-id=\"s0002\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>khỏe<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">健康、身體好<\/div><div class=\"wle\">healthy, well<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0003\" data-id=\"s0003\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>không<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">不、沒有；（句尾）嗎<\/div><div class=\"wle\">not, no; question particle at the end<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0003\" data-id=\"s0003\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>còn<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">那…呢；還<\/div><div class=\"wle\">and what about; still<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0004\" data-id=\"s0004\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>dạ<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">是（禮貌的應答）<\/div><div class=\"wle\">yes (polite answer, said by the younger one)<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0005\" data-id=\"s0005\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>con<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">孩子；我（對父母說）<\/div><div class=\"wle\">child; I (to a parent)<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0005\" data-id=\"s0005\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>cảm ơn<\/b> <span class=\"wlh\">感恩<\/span><div class=\"wlz\">謝謝<\/div><div class=\"wle\">thank you<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0006\" data-id=\"s0006\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>có<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">有<\/div><div class=\"wle\">have, there is<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0007\" data-id=\"s0007\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>gì<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">什麼<\/div><div class=\"wle\">what<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0007\" data-id=\"s0007\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>không có gì<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">不客氣<\/div><div class=\"wle\">you&#x27;re welcome, it&#x27;s nothing<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0007\" data-id=\"s0007\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>tên<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">名字<\/div><div class=\"wle\">name<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0008\" data-id=\"s0008\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>là<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">是<\/div><div class=\"wle\">to be<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0008\" data-id=\"s0008\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>rất<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">很<\/div><div class=\"wle\">very<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0010\" data-id=\"s0010\" aria-label=\"first sentence\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"/><\/svg><\/button><\/div><div class=\"wl\"><div class=\"wlt\"><b>vui<\/b> <span class=\"wlh\"><\/span><div class=\"wlz\">開心<\/div><div class=\"wle\">happy, glad<\/div><\/div><button class=\"btn play mini\" data-act=\"play\" data-play=\"s0010\" data-id=\
